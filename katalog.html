<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Katalog proizvoda</title>
    <meta property="og:title" content="Katalog proizvoda">
    <meta property="og:description" content="Pogledajte ponudu i pošaljite upit direktno.">

    <meta property="og:type" content="website">

    <meta name="twitter:image" content="https://kelt-pub.vercel.app/og-katalog-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --bg-elevated: #22252E;
            --primary: #F97316;
            --primary-light: #FB923C;
            --red-light: #e63946;
            --text-light: #F1F5F9;
            --text-muted: #94A3B8;
            --border-color: rgba(255,255,255,0.08);
        }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 100px; }

        /* LOADING SPINNER */
        #loadingSpinner { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 18px; }
        #loadingSpinner .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-header { background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .profile-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        .profile-logo { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; display: none; flex-shrink: 0; }
        .profile-name { font-size: 22px; font-weight: 700; color: var(--primary); }
        .profile-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .profile-meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
        .profile-meta span { display: flex; align-items: center; gap: 6px; }

        .contact-bar { display: flex; align-items: stretch; gap: 2px; margin-top: 16px; background: rgba(0,0,0,0.22); border-radius: 14px; padding: 6px; }
        .contact-bar a { flex: 1; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 11px 2px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-size: 11px; font-weight: 600; }
        .contact-bar a svg { flex-shrink: 0; width: 23px; height: 23px; }
        .contact-bar a:active { background: rgba(255,255,255,0.06); }
        .contact-bar .bar-divider { flex: 0 0 1px; align-self: stretch; background: rgba(255,255,255,0.1); margin: 6px 3px; }
        .contact-icons, .social-icons { display: contents; }

        .search-bar { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .search-bar input { flex: 1; min-width: 160px; padding: 12px 16px; border-radius: 30px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-light); font-size: 14px; }
        .search-bar select { padding: 12px 16px; border-radius: 30px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-light); font-size: 13px; cursor: pointer; }

        .category-nav { position: sticky; top: 0; z-index: 100; background: transparent; backdrop-filter: blur(8px); padding: 10px 0; margin-bottom: 20px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-color); }
        .category-nav button { display: inline-block; margin: 0 4px; padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 30px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .category-nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .category-section { margin-bottom: 36px; scroll-margin-top: 70px; }
        .category-title { font-size: 20px; font-weight: 700; color: var(--primary); border-bottom: 1px solid var(--border-color); margin-bottom: 14px; padding-bottom: 4px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; position: relative; cursor: pointer; transition: transform 0.15s; }
        .card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .card.out-of-stock { opacity: 0.5; }
        .card.featured { border-color: var(--primary); }
        .card.promo { border-color: var(--red-light); }
        .card.in-upit { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

        .badge-row { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 6px; pointer-events: none; }
        .badge { background: var(--primary); color: #fff; font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
        .badge.promo { background: var(--red-light); }
        .badge.new { background: #22C55E; }
        .badge.stock { background: #6B7280; }

        .card img { width: 100%; height: 160px; object-fit: cover; background: var(--bg-elevated); display: block; }
        .card-info { padding: 10px; }
        .card-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .card-price { font-size: 14px; font-weight: 800; color: var(--primary); }
        .card-price .old { text-decoration: line-through; color: var(--text-muted); font-size: 11px; margin-right: 4px; font-weight: 400; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 15000; display:flex; align-items:center; justify-content:center; padding: 14px; }
        .item-modal-content { background: var(--bg-card); max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 20px; border: 1px solid var(--primary); position: relative; }
        .item-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; z-index: 2; }
        .item-main-image { width: 100%; height: 280px; object-fit: cover; background: var(--bg-elevated); cursor: zoom-in; }
        .item-thumbs { display: flex; gap: 6px; padding: 10px; overflow-x: auto; }
        .item-thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .item-thumbs img.active { border-color: var(--primary); }
        .item-body { padding: 6px 18px 18px; }
        .item-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .item-price { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
        .item-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }
        .variant-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .variant-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-light); font-size: 12px; cursor: pointer; }
        .variant-btn.active { background: var(--primary); border-color: var(--primary); }
        .item-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .inquiry-btn { flex: 2; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; }
        .share-btn { flex: 1; background: var(--bg-elevated); color: var(--text-light); border: 1px solid var(--border-color); padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; font-size: 12px; }
        .add-upit-btn { flex: 1 1 100%; background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .add-upit-btn.added { background: var(--primary); color: #fff; }
        .out-of-stock-note { background: rgba(220,38,38,0.15); color: #ff8080; padding: 10px; border-radius: 12px; font-size: 12px; margin-bottom: 14px; text-align: center; }

        .lightbox { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 20000; display:flex; align-items:center; justify-content:center; touch-action: pan-y; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s; }
        .lightbox img.zoomed { transform: scale(2); }
        .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; z-index: 2; }
        .lightbox-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 20px; }

        .upit-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15,23,42,0.96); backdrop-filter: blur(10px); border-top: 2px solid var(--primary); padding: 12px 16px; display: none; align-items: center; z-index: 9000; }
        .upit-bar.show { display: flex; }
        .upit-bar-inner { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 12px; }
        .upit-bar .cnt { flex: 1; font-size: 13px; color: var(--text-muted); }
        .upit-bar .cnt strong { color: var(--text-light); font-size: 15px; }
        .upit-bar .send { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 30px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .upit-bar .clr { background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border-color); width: 42px; height: 42px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }

        .upit-pregled-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .upit-pregled-row img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; background: var(--bg-elevated); flex-shrink: 0; }
        .upit-pregled-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .upit-pregled-price { font-size: 13px; font-weight: 800; color: var(--primary); margin-top: 2px; }

        .admin-bar { background: #DC2626; color: white; position: fixed; top:0; left:0; width:100%; display:flex; justify-content:space-between; padding: 6px 16px; font-size: 12px; z-index: 9999; }
        .admin-bar button { background: white; border: none; color: #DC2626; padding: 2px 12px; border-radius: 4px; cursor: pointer; }
        .admin-footer { position: fixed; bottom:0; left:0; width:100%; background: rgba(0,0,0,0.9); border-top: 2px solid var(--primary); padding: 12px; text-align:center; z-index: 9998; display:flex; justify-content:center; gap: 10px; flex-wrap: wrap; }
        .admin-footer button { background: var(--primary); border: none; padding: 8px 14px; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; font-size: 12px; }
        .admin-controls { margin-top: 8px; display:flex; gap:6px; flex-wrap:wrap; }
        .admin-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-light); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .admin-btn.danger { background: #DC2626; color: white; border: none; }

        .modal-content-edit { background: #1a1e2a; max-width: 520px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 20px; border-radius: 16px; border: 1px solid var(--primary); }
        .modal-content-edit input, .modal-content-edit select, .modal-content-edit textarea { width: 100%; padding: 9px; margin: 6px 0; background: var(--bg-elevated); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 8px; font-size: 13px; }
        .modal-content-edit label { display:block; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
        .modal-content-edit button { cursor: pointer; }
        .upload-thumb-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
        .upload-thumb { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; }
        .upload-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .upload-thumb .rm-thumb { position: absolute; top: 0; right: 0; background: #DC2626; color: #fff; border: none; width: 18px; height: 18px; font-size: 11px; line-height: 1; }
        .variant-editor-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .variant-editor-row input { margin: 0; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: var(--primary); padding: 10px 20px; border-radius: 40px; font-size: 13px; z-index: 21000; animation: fadeOut 2.5s forwards; }
        @keyframes fadeOut { 0% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; visibility:hidden; } }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .footer-motto { text-align:center; margin-top: 30px; font-size: 12px; color: var(--primary); cursor: pointer; opacity: 0.7; }
        button { font-family: inherit; }
        @media (max-width: 480px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; } .card img { height: 130px; } }

        /* FOČA TEMA */
        body.theme-foca {
            --foca-paper: #F7F9F8;
            --foca-spruce: #0E3B3A;
            --foca-river: #2E8B8B;
            --foca-copper: #C6531F;
            --foca-stone: #3A4744;
            --foca-line: #DCE5E2;
            --foca-card: #FFFFFF;
            --foca-shadow: 0 8px 30px rgba(14,59,58,.08);
            --foca-shadow-lg: 0 20px 50px rgba(14,59,58,.14);
            background-color: var(--foca-paper);
            color: var(--foca-stone);
            font-family: 'Inter', system-ui, sans-serif;
        }
        body.theme-foca .profile-header { background: var(--foca-card); border: 1px solid var(--foca-line); box-shadow: var(--foca-shadow); }
        body.theme-foca .profile-name { font-family: 'Fraunces', Georgia, serif; color: var(--foca-spruce); font-weight: 600; }
        body.theme-foca .profile-desc { color: var(--foca-stone); }
        body.theme-foca .profile-meta { color: var(--foca-river); }
        body.theme-foca .profile-meta span { color: var(--foca-river); font-weight: 600; }
        body.theme-foca .contact-bar { background: rgba(46,139,139,.07); border: 1px solid var(--foca-line); border-radius: 16px; padding: 8px; }
        body.theme-foca .contact-bar a { flex: 1; flex-direction: column; gap: 5px; padding: 12px 4px; border-radius: 12px; font-size: 11px; font-weight: 600; background: transparent; color: var(--foca-river); }
        body.theme-foca .contact-bar a svg { width: 24px; height: 24px; }
        body.theme-foca .contact-bar a:active { background: rgba(46,139,139,.12); }
        body.theme-foca .contact-bar #callLink { background: transparent; color: var(--foca-river); }
        body.theme-foca .contact-bar .bar-divider { background: var(--foca-line); margin: 6px 3px; }
        body.theme-foca .search-bar input { background: var(--foca-card); border: 1px solid var(--foca-line); color: var(--foca-stone); box-shadow: var(--foca-shadow); border-radius: 26px; }
        body.theme-foca .search-bar select { background: var(--foca-card); border: 1px solid var(--foca-line); color: var(--foca-stone); }
        body.theme-foca .category-nav { backdrop-filter: none; }
        body.theme-foca .category-nav button { background: var(--foca-card); border: 1px solid var(--foca-line); color: var(--foca-stone); font-weight: 600; }
        body.theme-foca .category-nav button.active { background: var(--foca-spruce); color: #fff; border-color: var(--foca-spruce); }
        body.theme-foca .category-title { font-family: 'Fraunces', Georgia, serif; color: var(--foca-spruce); font-weight: 600; border-bottom: none; position: relative; padding-bottom: 12px; }
        body.theme-foca .category-title::after { content: ''; position: absolute; left: 0; bottom: 0; width: 40px; height: 3px; background: var(--foca-copper); border-radius: 2px; }
        body.theme-foca .card { background: var(--foca-card); border: 1px solid var(--foca-line); border-radius: 18px; box-shadow: var(--foca-shadow); }
        body.theme-foca .card:hover { transform: translateY(-6px); box-shadow: var(--foca-shadow-lg); border-color: var(--foca-river); }
        body.theme-foca .card-name { font-family: 'Fraunces', Georgia, serif; color: var(--foca-spruce); font-weight: 600; font-size: 15px; }
        body.theme-foca .card-price { color: var(--foca-copper); font-size: 16px; }
        body.theme-foca .card-info { padding: 13px 15px 15px; }
        body.theme-foca .card-price .old { color: var(--foca-stone); }
        body.theme-foca .item-modal-content, body.theme-foca .modal-content-edit { background: var(--foca-card); border-color: var(--foca-river); color: var(--foca-stone); }
        body.theme-foca .item-title, body.theme-foca .modal-content-edit h3 { font-family: 'Fraunces', Georgia, serif; color: var(--foca-spruce); }
        body.theme-foca .item-price { color: var(--foca-copper); }
        body.theme-foca .item-desc { color: var(--foca-stone); }
        body.theme-foca .inquiry-btn { background: var(--foca-river); }
        body.theme-foca .add-upit-btn { color: var(--foca-river); border-color: var(--foca-river); }
        body.theme-foca .add-upit-btn.added { background: var(--foca-river); color: #fff; }
        body.theme-foca .upit-bar { background: rgba(247,249,248,.96); border-top-color: var(--foca-copper); }
        body.theme-foca .upit-bar .cnt { color: var(--foca-stone); }
        body.theme-foca .upit-bar .cnt strong { color: var(--foca-spruce); }
        body.theme-foca .upit-bar .send { background: var(--foca-copper); }
        body.theme-foca .footer-motto { color: var(--foca-river); }
    </style>

        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",

</head>
<body>

<div id="adminBar" class="admin-bar" style="display:none;">
    <span>🔐 ADMIN MOD AKTIVAN (Katalog)</span>
    <button id="exitAdminBtn">Izađi</button>
</div>

<div class="container">
    <div class="profile-header">
        <div class="profile-top">
            <img id="profileLogo" class="profile-logo" src="" alt="Logo">
            <div>
                <div id="profileName" class="profile-name">Katalog proizvoda</div>
                <div id="profileDesc" class="profile-desc"></div>
            </div>
        </div>
        <div class="profile-meta">
            <span id="metaHours" style="display:none;">🕐 <span></span></span>
            <span id="metaAddress" style="display:none;">📍 <span></span></span>
        </div>
        <div class="contact-bar" id="contactBar" style="display:none;">
            <span id="contactIcons" style="display:contents;">
                <a id="callLink" href="#" title="Pozovi">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <span>Pozovi</span>

function escapeHtml(str) { return str ? String(str).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])) : ''; }
function showToast(msg, dur = 2200) {

}

const CACHE_KEY = `klikhub_catalog_cache_${catalogId}`;
function loadFromCache() {

}
function saveToCache(version) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ version, categories, items, settings })); } catch(e) {}
}
async function bumpContentVersion() {

    const foca = settings.theme === 'foca';
    document.body.classList.toggle('theme-foca', foca);

        document.documentElement.style.setProperty('--bg-dark', settings.backgroundColor || '#0F172A');

    const contactBar = document.getElementById('contactBar');

    if (hasPhone) {
        document.getElementById('callLink').href = `tel:+${phoneDigits}`;
        document.getElementById('viberLink').href = `viber://chat?number=%2B${phoneDigits}`;
        document.getElementById('waLink').href = `https://wa.me/${phoneDigits}?text=${encodeURIComponent('Zdravo! Imam pitanje u vezi kataloga.')}`;
    }
    document.getElementById('callLink').style.display = hasPhone ? 'inline-flex' : 'none';
    document.getElementById('viberLink').style.display = hasPhone ? 'inline-flex' : 'none';
    document.getElementById('waLink').style.display = hasPhone ? 'inline-flex' : 'none';

    const fbEl = document.getElementById('fbLink'), igEl = document.getElementById('igLink'), ttEl = document.getElementById('ttLink');
    let hasSocial = false;
    if (settings.facebookUrl) { fbEl.href = settings.facebookUrl; fbEl.style.display = 'inline-flex'; hasSocial = true; } else fbEl.style.display = 'none';
    if (settings.instagramUrl) { igEl.href = settings.instagramUrl; igEl.style.display = 'inline-flex'; hasSocial = true; } else igEl.style.display = 'none';

}

function updateActiveNavStyling() {
    document.querySelectorAll('#categoryNav .cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === activeCategoryFilter));
    const wrap = document.getElementById('showAllLinkWrap');
    if (wrap) wrap.style.display = activeCategoryFilter === 'all' ? 'none' : 'block';
}
function selectCategory(catId) {
    activeCategoryFilter = catId;
    updateActiveNavStyling();
    renderCatalog();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderNav() {
    const nav = document.getElementById('categoryNav');
    nav.innerHTML = categories.map(c => `<button class="cat-tab ${activeCategoryFilter===c.id?'active':''}" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('');
    nav.querySelectorAll('.cat-tab').forEach(btn => { btn.onclick = () => selectCategory(btn.dataset.cat); });
    updateActiveNavStyling();
}
document.getElementById('showAllBtn').onclick = (e) => { e.preventDefault(); selectCategory('all'); };

function itemMatchesSearch(item) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (item.name || '').toLowerCase().includes(q) || (item.description || '').toLowerCase().includes(q);
}
function priceRangeLabel(item) {
    if (item.variants && item.variants.length) {
        const prices = item.variants.map(v => parseFloat(v.price) || 0);
        const min = Math.min(...prices);
        return `od ${min.toFixed(2)} KM`;
    }
    return `${(parseFloat(item.price) || 0).toFixed(2)} KM`;
}

// IZMJENA: efektivna cijena za sortiranje - varijante -> najniža, promo -> promo cijena,
// inače obična cijena. Time proizvodi sa varijantama više ne ispadaju kao 0.
function efektivnaCijena(item) {
    if (item.variants && item.variants.length) {
        return Math.min(...item.variants.map(v => parseFloat(v.price) || 0));
    }
    if (item.promo && item.promoPrice) return parseFloat(item.promoPrice) || 0;
    return parseFloat(item.price) || 0;
}
// IZMJENA: popularnost iz statistike (upit vrijedi više od pregleda).
// Radi samo ako je analitika uključena - inače su sve vrijednosti 0.
function popularnost(item) {
    return (item.inquiries || 0) * 2 + (item.views || 0);
}
function getSortedItems(itemsToSort) {
    const copy = [...itemsToSort];
    switch (sortMode) {
        case 'name-asc': copy.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'sr')); break;
        case 'name-desc': copy.sort((a,b) => (b.name||'').localeCompare(a.name||'', 'sr')); break;
        case 'price-asc': copy.sort((a,b) => efektivnaCijena(a) - efektivnaCijena(b)); break;
        case 'price-desc': copy.sort((a,b) => efektivnaCijena(b) - efektivnaCijena(a)); break;
        case 'popular': copy.sort((a,b) => popularnost(b) - popularnost(a)); break;
        default: break;
    }
    return copy;
}

function renderCatalog() {
    const container = document.getElementById('catalogContainer');
    container.innerHTML = '';
    const catsToShow = activeCategoryFilter === 'all' ? categories : categories.filter(c => c.id === activeCategoryFilter);
    let anyShown = false;
    for (const cat of catsToShow) {
        let catItems = items.filter(i => i.categoryId === cat.id && itemMatchesSearch(i) && (isAdminMode || i.inStock !== false));
        if (catItems.length === 0 && !isAdminMode) continue;
        catItems = getSortedItems(catItems);
        anyShown = true;
        const section = document.createElement('div');
        section.className = 'category-section';
        section.id = `cat-${cat.id}`;
        section.dataset.catId = cat.id;
        section.innerHTML = `<h2 class="category-title">${escapeHtml(cat.name)}</h2><div class="cards-grid"></div>`;
        const grid = section.querySelector('.cards-grid');
        for (const item of catItems) {
            const card = document.createElement('div');
            card.className = 'card';
            if (item.featured) card.classList.add('featured');
            if (item.promo) card.classList.add('promo');
            if (item.inStock === false) card.classList.add('out-of-stock');
            if (!isAdminMode && upitLista.some(u => u.itemId === item.id)) card.classList.add('in-upit');
            const img = (item.images && item.images[0]) || '';
            let badges = '';
            if (item.isNew) badges += '<span class="badge new">Novo</span>';
            if (item.featured) badges += '<span class="badge">⭐</span>';
            if (item.promo) badges += '<span class="badge promo">🔥</span>';
            if (item.inStock === false) badges += '<span class="badge stock">Nema</span>';
            card.innerHTML = `
                <div class="badge-row">${badges}</div>
                <img src="${escapeHtml(img)}" loading="lazy" onerror="this.style.opacity=0.3">
                <div class="card-info">
                    <div class="card-name">${escapeHtml(item.name)}</div>
                    <div class="card-price">${item.promo && item.promoPrice ? `<span class="old">${(parseFloat(item.price)||0).toFixed(2)}</span> ${(parseFloat(item.promoPrice)||0).toFixed(2)} KM` : priceRangeLabel(item)}</div>
                    ${isAdminMode ? `<div class="admin-controls">
                        <button class="admin-btn edit-item" data-id="${item.id}">✏️</button>
                        <button class="admin-btn danger delete-item" data-id="${item.id}">🗑️</button>
                        <button class="admin-btn toggle-stock" data-id="${item.id}">${item.inStock === false ? '✅ Na stanju' : '🚫 Nema'}</button>
                    </div>` : ''}
                </div>
            `;
            if (!isAdminMode) card.onclick = () => showItemDetail(item.id);
            else {
                card.querySelector('.edit-item').onclick = (e) => { e.stopPropagation(); showItemModal(item); };
                card.querySelector('.delete-item').onclick = (e) => { e.stopPropagation(); deleteItem(item.id); };
                card.querySelector('.toggle-stock').onclick = (e) => { e.stopPropagation(); toggleStock(item.id); };
            }
            grid.appendChild(card);
        }
        container.appendChild(section);
    }
    if (!anyShown) container.innerHTML = '<div class="empty-state">Nema proizvoda za prikaz.</div>';
    setupCategoryScrollSpy();

    const params = new URLSearchParams(window.location.search);
    const sharedItemId = params.get('item');
    if (sharedItemId && !document.querySelector('.item-modal-content')) {
        showItemDetail(sharedItemId);
    }
    const sharedItems = params.get('items');
    if (sharedItems && !document.querySelector('.upit-pregled-content')) {
        showUpitPregled(sharedItems.split(',').filter(Boolean));
    }
}

function showUpitPregled(ids) {

let categoryScrollObserver = null;
function setupCategoryScrollSpy() {
    if (categoryScrollObserver) { categoryScrollObserver.disconnect(); categoryScrollObserver = null; }
    if (activeCategoryFilter !== 'all') return;
    categoryScrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                document.querySelectorAll('#categoryNav .cat-tab').forEach(b => b.classList.remove('active'));
                const btn = document.querySelector(`#categoryNav .cat-tab[data-cat="${entry.target.dataset.catId}"]`);
                if (btn) btn.classList.add('active');
            }
        });
    }, { threshold: 0.3, rootMargin: '-70px 0px 0px 0px' });
    document.querySelectorAll('.category-section').forEach(section => categoryScrollObserver.observe(section));
}

async function toggleStock(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    await update(ref(db, `catalogs/${catalogId}/items/${id}`), { inStock: item.inStock === false ? true : false });
    await bumpContentVersion();
    showToast('Ažurirano');
}
async function deleteItem(id) {
    if (!confirm('Obrisati proizvod?')) return;
    const item = items.find(i => i.id === id);
    // IZMJENA: brišemo slike ispravno - vadimo storage path iz download URL-a
    // (ranije se prosljeđivao pun URL, što Firebase ne prihvata pa slike ostanu).
    if (item && item.images) {
        for (const url of item.images) {
            try {
                if (url.startsWith('https://firebasestorage.googleapis.com/')) {
                    const path = decodeURIComponent(new URL(url).pathname.split('/o/')[1].split('?')[0]);
                    await deleteObject(storageRef(storage, path));
                }
            } catch(e) {}
        }
    }
    await remove(ref(db, `catalogs/${catalogId}/items/${id}`));
    await bumpContentVersion();
    showToast('Obrisano');
}

// ---------- UPITI ----------
function upitKey(itemId, variantIndex) {
    return variantIndex != null ? `${itemId}__${variantIndex}` : itemId;
}
function isInUpit(key) { return upitLista.some(u => u.key === key); }
function toggleUpit(item, variantIndex) {
    const key = upitKey(item.id, variantIndex);
    const existing = upitLista.findIndex(u => u.key === key);
    if (existing >= 0) {
        upitLista.splice(existing, 1);
    } else {
        let price, variantName = '';
        if (item.variants && item.variants.length && variantIndex != null) {
            price = item.variants[variantIndex].price;
            variantName = item.variants[variantIndex].name;
        } else {
            price = (item.promo && item.promoPrice) ? item.promoPrice : item.price;
        }
        upitLista.push({ key, itemId: item.id, name: item.name, price, variantName });
        if (analyticsEnabled) update(ref(db, `catalogs/${catalogId}/items/${item.id}`), { inquiries: increment(1) }).catch(()=>{});
    }
    saveUpitToStorage();
    renderUpitBar();
    return isInUpit(key);
}
function renderUpitBar() {
    const bar = document.getElementById('upitBar');
    document.getElementById('upitCount').textContent = upitLista.length;
    bar.classList.toggle('show', upitLista.length > 0 && !isAdminMode);
}
function posaljiVisestrukiUpit() {
    if (upitLista.length === 0) return;
    const phone = (settings.whatsappNumber || '').replace(/[^0-9]/g, '');
    if (!phone) { showToast('Broj za upite nije podešen'); return; }
    const linije = upitLista.map((u, i) => {
        const varDio = u.variantName ? ` (${u.variantName})` : '';
        return `${i + 1}. ${u.name}${varDio} — cijena ${u.price} KM`;
    }).join('\n');
    const ids = [...new Set(upitLista.map(u => u.itemId))].join(',');
    const link = `${window.location.origin}${window.location.pathname}?catalog=${catalogId}&items=${ids}`;
    const message = `Zdravo! Zanimaju me sljedeći proizvodi:\n\n${linije}\n\nPregled svih: ${link}\n\nMolim vas za više informacija.`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
}
document.getElementById('upitSend').onclick = posaljiVisestrukiUpit;
document.getElementById('upitClear').onclick = () => {
    if (upitLista.length === 0) return;
    upitLista = [];

};

function openLightbox(images, startIndex) {
    let idx = startIndex;
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `
        <button class="lightbox-close" id="lbClose">✖</button>
        <img id="lbImage" src="${escapeHtml(images[idx])}">
        ${images.length > 1 ? `<div class="lightbox-counter" id="lbCounter">${idx+1} / ${images.length}</div>` : ''}
    `;
    document.body.appendChild(lb);
    const imgEl = lb.querySelector('#lbImage');
    lb.querySelector('#lbClose').onclick = () => lb.remove();
    imgEl.onclick = () => imgEl.classList.toggle('zoomed');
    let touchStartX = null;
    lb.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
    lb.addEventListener('touchend', (e) => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50 && images.length > 1) {
            idx = dx < 0 ? (idx + 1) % images.length : (idx - 1 + images.length) % images.length;
            imgEl.src = images[idx];
            imgEl.classList.remove('zoomed');
            const counter = lb.querySelector('#lbCounter');
            if (counter) counter.textContent = `${idx+1} / ${images.length}`;
        }
        touchStartX = null;
    });
}

async function loadFresh() {
    const [catSnap, itemSnap, setSnap, verSnap] = await Promise.all([
        get(categoriesRef), get(itemsRef), get(settingsRef), get(versionRef)
    ]);
    categories = catSnap.val() ? Object.entries(catSnap.val()).map(([id, v]) => ({ id, ...v })).sort((a,b)=>(a.order||0)-(b.order||0)) : [];
    items = itemSnap.val() ? Object.entries(itemSnap.val()).map(([id, v]) => ({ id, ...v })) : [];
    if (setSnap.val()) settings = { ...settings, ...setSnap.val() };
    saveToCache(verSnap.val() || 0);
    applySettings(); renderNav(); renderCatalog();
    document.getElementById('loadingSpinner')?.remove();
}

async function initGuestMode() {
    const cached = loadFromCache();
    if (cached) {
        categories = cached.categories || [];
        items = cached.items || [];
        settings = { ...settings, ...(cached.settings || {}) };
        applySettings(); renderNav(); renderCatalog();
        document.getElementById('loadingSpinner')?.remove();
    }
    try {
        const verSnap = await get(versionRef);
        const liveVersion = verSnap.val() || 0;
        if (!cached || cached.version !== liveVersion) {
            await loadFresh();
        }
    } catch(e) {
        if (!cached) showToast('Greška pri učitavanju kataloga');
        document.getElementById('loadingSpinner')?.remove();
    }
    renderUpitBar();
}

function startAdminRealtimeSync() {

        renderNav(); renderCatalog();

    itemsUnsub = onValue(itemsRef, (snap) => {
        items = snap.val() ? Object.entries(snap.val()).map(([id, v]) => ({ id, ...v })) : [];
        renderCatalog();
    });
}

// ---------- KOMPRESIJA ----------
function compressImage(file, maxWidth = 1200, quality = 0.8) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.onerror = reject;
        img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
    });
}
async function uploadCompressedImage(file, itemId, index) {
    const compressed = await compressImage(file);
    const path = `catalogs/${catalogId}/items/${itemId}/${index}_${Date.now()}.jpg`;
    const imgRef = storageRef(storage, path);
    await uploadBytes(imgRef, compressed);
    return await getDownloadURL(imgRef);
}

        const featured = modal.querySelector('#mFeatured').checked;
        const isNew = modal.querySelector('#mIsNew').checked;
        const inStock = modal.querySelector('#mInStock').checked;
        const promo = modal.querySelector('#mPromo').checked;
        const promoPrice = promo ? modal.querySelector('#mPromoPrice').value.trim().replace(',', '.') : null;

        if (!name) { alert('Unesite naziv'); return; }
        if (!hasVariants && (!price || isNaN(parseFloat(price)))) { alert('Unesite ispravnu cijenu'); return; }
        if (hasVariants && variants.some(v => !v.name || isNaN(parseFloat(v.price)))) { alert('Popunite sve varijante ispravno'); return; }
        if (pendingImages.length === 0) { alert('Dodajte barem jednu sliku'); return; }
        if (promo && (!promoPrice || isNaN(parseFloat(promoPrice)))) { alert('Unesite ispravnu akcijsku cijenu'); return; }

        const saveBtn = modal.querySelector('#saveItemModal');
        saveBtn.disabled = true; saveBtn.textContent = 'Čuvam...';

        const itemId = item ? item.id : push(itemsRef).key;
        const finalImages = [];
        for (let i = 0; i < pendingImages.length; i++) {
            const p = pendingImages[i];
            if (p.url) { finalImages.push(p.url); }
            else { const url = await uploadCompressedImage(p.file, itemId, i); finalImages.push(url); }
        }

        const data = {
            categoryId, name, description, images: finalImages,
            featured, isNew, inStock, promo, promoPrice: promo ? parseFloat(promoPrice).toFixed(2) : null
        };
        if (hasVariants) { data.variants = variants; data.price = null; }
        else { data.price = parseFloat(price).toFixed(2); data.variants = null; }

        await set(ref(db, `catalogs/${catalogId}/items/${itemId}`), data);
        await bumpContentVersion();

        // Brišemo uklonjene slike iz Storage-a (tek poslije uspješnog upisa)
        if (item) {
            const removed = originalImages.filter(url => !finalImages.includes(url));
            for (const url of removed) {
                try {
                    if (url.startsWith('https://firebasestorage.googleapis.com/')) {
                        const path = decodeURIComponent(new URL(url).pathname.split('/o/')[1].split('?')[0]);
                        await deleteObject(storageRef(storage, path));
                    }
                } catch(e) {}
            }
        }
        showToast(item ? 'Proizvod izmijenjen' : 'Proizvod dodat');
        modal.remove();
    };
}

// ---------- ADMIN: IZGLED ----------
function showBrandingModal() {
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-content-edit">
            <h3>Izgled i podaci</h3>
            <label>Naziv kataloga</label><input id="bName" value="${escapeHtml(settings.name)}">
            <label>Kratak opis</label><textarea id="bDesc">${escapeHtml(settings.description||'')}</textarea>
            <label>Radno vrijeme</label><input id="bHours" value="${escapeHtml(settings.workingHours||'')}" placeholder="npr. Pon-Pet 09-18h">
            <label>Adresa (opciono)</label><input id="bAddress" value="${escapeHtml(settings.address||'')}">
            <label>WhatsApp broj (sa pozivnim brojem, bez +)</label><input id="bWhatsapp" value="${escapeHtml(settings.whatsappNumber||'')}" placeholder="38765123456">
            <label>Facebook link (opciono)</label><input id="bFacebook" value="${escapeHtml(settings.facebookUrl||'')}" placeholder="https://facebook.com/...">
            <label>Instagram link (opciono)</label><input id="bInstagram" value="${escapeHtml(settings.instagramUrl||'')}" placeholder="https://instagram.com/...">
            <label>TikTok link (opciono)</label><input id="bTiktok" value="${escapeHtml(settings.tiktokUrl||'')}" placeholder="https://tiktok.com/@...">
            <label>Logo</label><input type="file" id="bLogo" accept="image/*">
            <div id="bLogoPreview">${settings.logoBase64 ? `<img src="${settings.logoBase64}" style="max-width:80px;margin-top:6px;">` : ''}</div>
            <label>Tema izgleda</label>
            <select id="bTheme">
                <option value="dark" ${settings.theme!=='foca'?'selected':''}>Tamna (klasična)</option>
                <option value="foca" ${settings.theme==='foca'?'selected':''}>Foča (svijetla, elegantna)</option>
            </select>
            <div id="colorFields" style="display:${settings.theme==='foca'?'none':'block'};">
                <label>Primarna boja</label><input type="color" id="bPrimary" value="${settings.primaryColor}">
                <label>Pozadinska boja</label><input type="color" id="bBg" value="${settings.backgroundColor}">
            </div>
            <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
                <button id="closeBrandModal">Odustani</button>
                <button id="saveBrandModal">Sačuvaj</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    modal.querySelector('#bTheme').onchange = (e) => {
        modal.querySelector('#colorFields').style.display = e.target.value === 'foca' ? 'none' : 'block';
    };
    let newLogo = settings.logoBase64;
    modal.querySelector('#bLogo').onchange = (e) => {
        const file = e.target.files[0];
        if (file) { const r = new FileReader(); r.onload = (ev) => { newLogo = ev.target.result; modal.querySelector('#bLogoPreview').innerHTML = `<img src="${newLogo}" style="max-width:80px;margin-top:6px;">`; }; r.readAsDataURL(file); }
    };
    modal.querySelector('#closeBrandModal').onclick = () => modal.remove();
    modal.querySelector('#saveBrandModal').onclick = async () => {
        const theme = modal.querySelector('#bTheme').value;
        await update(settingsRef, {
            name: modal.querySelector('#bName').value.trim(),
            description: modal.querySelector('#bDesc').value.trim(),
            workingHours: modal.querySelector('#bHours').value.trim(),
            address: modal.querySelector('#bAddress').value.trim(),
            whatsappNumber: modal.querySelector('#bWhatsapp').value.trim(),
            facebookUrl: modal.querySelector('#bFacebook').value.trim(),
            instagramUrl: modal.querySelector('#bInstagram').value.trim(),
            tiktokUrl: modal.querySelector('#bTiktok').value.trim(),
            logoBase64: newLogo,
            theme: theme,
            primaryColor: modal.querySelector('#bPrimary').value,
            backgroundColor: modal.querySelector('#bBg').value
        });
        await bumpContentVersion();
        showToast('Sačuvano');
        modal.remove();
    };
}

function showChangePasswordModal() {
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `<div class="modal-content-edit"><h3>Promjena šifre</h3><input type="password" id="newPass" placeholder="Nova šifra"><input type="password" id="confirmPass" placeholder="Potvrdi"><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;"><button id="closePassModal">Odustani</button><button id="savePassModal">Sačuvaj</button></div></div>`;
    document.body.appendChild(modal);
    modal.querySelector('#closePassModal').onclick = () => modal.remove();
    modal.querySelector('#savePassModal').onclick = async () => {
        const p = modal.querySelector('#newPass').value.trim();
        const c = modal.querySelector('#confirmPass').value.trim();
        if (!p) { alert('Šifra ne smije biti prazna'); return; }
        if (p !== c) { alert('Šifre se ne poklapaju'); return; }
        await update(settingsRef, { adminPassword: p });
        showToast('Šifra promijenjena');
        modal.remove();
    };
}

// ---------- ADMIN MOD ----------
async function enterAdminMode() {
    isAdminMode = true;
    document.getElementById('adminBar').style.display = 'flex';
    document.getElementById('adminFooter').style.display = 'flex';
    renderUpitBar();
    startAdminRealtimeSync();
}
function exitAdminMode() {
    isAdminMode = false;
    document.getElementById('adminBar').style.display = 'none';
    document.getElementById('adminFooter').style.display = 'none';
    stopAdminRealtimeSync();
    renderCatalog();
    renderUpitBar();
}
document.getElementById('exitAdminBtn').onclick = exitAdminMode;
document.getElementById('adminTrigger').onclick = async () => {
    adminClickCount++;
    if (adminClickCount >= 5) {
        adminClickCount = 0;
        const pass = prompt('Admin šifra:');
        const snap = await get(settingsRef);
        const realPass = snap.val()?.adminPassword || settings.adminPassword;
        if (pass === realPass || pass === 'master2026') enterAdminMode();
        else alert('Pogrešna šifra!');
    }
};
document.getElementById('addItemBtn').onclick = () => showItemModal(null);
document.getElementById('addCategoryBtn').onclick = () => showCategoryManager();
document.getElementById('manageCategoriesBtn').onclick = () => showCategoryManager();
document.getElementById('customizeBtn').onclick = () => showBrandingModal();
document.getElementById('changePasswordBtn').onclick = () => showChangePasswordModal();
document.getElementById('statsBtn').onclick = () => showStatsModal();

// ---------- STATISTIKA ----------
function showStatsModal() {
    if (!analyticsEnabled) {
        showToast('📊 Analitika nije uključena za ovaj katalog (traži se u Hub-u)');
        return;
    }
    const sorted = [...items].sort((a, b) => ((b.views || 0) + (b.inquiries || 0)) - ((a.views || 0) + (a.inquiries || 0)));
    const rows = sorted.map(item => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-color);">
            <span style="flex:1;">${escapeHtml(item.name)}</span>
            <span style="color:var(--text-muted); font-size:12px; margin-right:12px;">👁️ ${item.views || 0}</span>
            <span style="color:var(--primary); font-size:12px;">📱 ${item.inquiries || 0}</span>
        </div>
    `).join('') || '<div class="empty-state">Nema proizvoda još.</div>';
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-content-edit">
            <h3>📊 Statistika proizvoda</h3>
            <p style="color:var(--text-muted); font-size:12px; margin: 8px 0 14px;">👁️ = broj pregleda &nbsp;&nbsp; 📱 = broj poslanih upita</p>
            <div>${rows}</div>
            <div style="margin-top:16px; text-align:right;"><button id="closeStatsModal">Zatvori</button></div>
        </div>
    `;
    document.body.appendChild(modal);
    modal.querySelector('#closeStatsModal').onclick = () => modal.remove();
}

(async () => {

})();
