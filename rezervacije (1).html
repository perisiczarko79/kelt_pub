<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d0b">
<title>Rezervacije — Kelt Pub</title>
<style>
  :root{
    --bg: #0f0d0b;
    --bg-panel: #16130f;
    --line: rgba(212,175,110,0.16);
    --gold: #c9a15a;
    --gold-bright: #e6c17a;
    --text: #ece5d8;
    --text-dim: #9c9184;
    --shift1: #2f4d3a;
    --shift2: #4a2f2f;
    --warn: #c96a5a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, rgba(201,161,90,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  header{
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:16px;
  }
  h1{
    font-size:1.4rem;
    margin:0;
    letter-spacing:0.03em;
    font-weight:600;
    color:var(--gold-bright);
  }
  h1 .sub{
    display:block;
    font-family: -apple-system, sans-serif;
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:4px;
    font-weight:400;
  }
  .staff-panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin:18px 0;
  }
  .staff-panel-title{
    font-family:-apple-system, sans-serif;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  select{
    width:100%;background:#1c1712;border:1px solid var(--line);color:var(--text);
    padding:7px 8px;border-radius:6px;font-family:-apple-system, sans-serif;
    font-size:0.85rem;outline:none;
  }
  select:focus{border-color:var(--gold);}
  .btn{
    font-family:-apple-system, sans-serif;font-size:0.8rem;background:#1c1712;
    border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:7px;cursor:pointer;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{
    background:linear-gradient(135deg, #6b4f27, #4a3618);
    border-color:var(--gold);color:var(--gold-bright);
  }
  .hint{font-family:-apple-system, sans-serif;font-size:0.72rem;color:var(--text-dim);margin-top:10px;line-height:1.5;}
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    transform:translate(-50%, 14px);z-index:2000;
    max-width:min(430px, calc(100vw - 32px));
    background:#241d15;border:1px solid var(--gold);color:var(--text);
    font-family:-apple-system, sans-serif;font-size:0.84rem;line-height:1.35;
    padding:12px 18px;border-radius:12px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%, 0);}
  .toast.err{background:#2b1a16;border-color:var(--warn);color:#f2c8bd;}
  .btn.danger{color:#d58a7a;border-color:rgba(201,106,90,0.3);}
  .btn.danger:hover{border-color:var(--warn);color:#e8a595;}
  .stats-empty{font-family:-apple-system, sans-serif;font-size:0.8rem;color:var(--text-dim);padding:8px 0;}
  /* Centralno mjesto: kartice na vrhu + traka "Danas" */
  .tabbar{display:flex;gap:6px;margin:14px 0 4px;}
  .tabbar a,.tabbar button{
    display:block;text-align:center;text-decoration:none;
    flex:1;background:#1c1712;border:1px solid var(--line);color:var(--text-dim);
    font-family:-apple-system,sans-serif;font-size:.86rem;font-weight:600;
    padding:11px 8px;border-radius:9px;cursor:pointer;
  }
  .tabbar a.on,.tabbar button.on{background:rgba(201,161,90,0.16);border-color:var(--gold);color:var(--gold-bright);}
  #todayEvents:empty{display:none;}
  #todayEvents{margin-top:14px;}
  .today-event{
    text-decoration:none;
    display:block;width:100%;text-align:left;background:rgba(201,161,90,0.12);
    border:1px solid var(--gold);color:var(--gold-bright);font-family:-apple-system,sans-serif;
    font-size:.86rem;line-height:1.4;padding:11px 14px;border-radius:9px;margin-bottom:8px;cursor:pointer;
  }
  .ev-tag{display:block;margin-top:4px;font-family:-apple-system,sans-serif;font-size:.7rem;font-weight:400;color:var(--gold);white-space:normal;}

  /* Događaji i rezervacije */
  .ev-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;}
  .ev-card.open{border-color:var(--gold);}
  .ev-card.past{opacity:.7;}
  .ev-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:13px 14px;cursor:pointer;font-family:-apple-system,sans-serif;}
  .ev-title{color:var(--gold-bright);font-weight:700;font-size:.95rem;}
  .ev-meta{color:var(--text-dim);font-size:.76rem;text-align:right;flex-shrink:0;}
  .ev-body{padding:0 14px 14px;font-family:-apple-system,sans-serif;}
  .ev-note{font-size:.82rem;color:var(--text);background:#1e1a14;border-radius:7px;padding:9px 11px;margin-bottom:8px;line-height:1.45;white-space:pre-wrap;}
  .ev-total{font-size:.8rem;color:var(--gold);margin:10px 0 2px;}
  .ev-empty{font-size:.8rem;color:var(--text-dim);padding:8px 0;}
  .res-row{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
  .res-main{flex:1;min-width:0;}
  .res-table{display:block;color:var(--text-dim);font-size:.76rem;margin-top:2px;}
  .res-btn{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    width:38px;height:38px;border-radius:8px;cursor:pointer;flex-shrink:0;font-size:.9rem;
  }
  .ev-form,.res-form{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .ev-row{display:flex;gap:8px;}
  .ev-row > *{flex:1;min-width:0;}
  .ev-form input,.ev-form textarea,.res-form input{
    width:100%;background:#1c1712;border:1px solid var(--line);color:var(--text);
    padding:11px;border-radius:7px;font-family:-apple-system,sans-serif;font-size:1rem;outline:none;
  }
  .ev-form input:focus,.ev-form textarea:focus,.res-form input:focus{border-color:var(--gold);}
  .ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .ev-plan{background:#14110d;border:1px solid var(--line);border-radius:9px;margin:2px 0 10px;padding:4px;}
  .ev-plan svg{width:100%;height:auto;display:block;touch-action:manipulation;}
  .ev-plan .tb{cursor:pointer;}
  .ev-plan-hint{font-size:.74rem;color:var(--text-dim);margin:-4px 0 10px;line-height:1.4;}
  .assign-bar{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:rgba(201,161,90,.14);border:1px solid var(--gold);border-radius:8px;
    padding:8px 10px;font-size:.84rem;color:var(--gold-bright);margin-bottom:8px;
  }
  .assign-bar .btn{padding:7px 12px;}
  .res-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .res-row.assigning{background:rgba(201,161,90,.09);border-radius:6px;}
  .res-notable{color:#d99b8a;font-size:.76rem;display:block;margin-top:2px;}
  .pending-tables{font-size:.82rem;color:var(--gold-bright);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pending-tables button{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:7px;padding:5px 9px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rezervacije<span class="sub" id="brandSub">KlikHub</span></h1>
    <div id="todayEvents"></div>
    <nav class="tabbar">
      <a data-nav="smjene">👥 Smjene</a>
      <a data-nav="rez" class="on">📅 Rezervacije</a>
    </nav>
  </header>
  <section id="tabEvents">
    <div id="eventsList" style="margin-top:14px;"></div>
    <button class="btn primary" id="newEventBtn" style="width:100%;">+ Novi događaj</button>
    <div id="eventForm" class="staff-panel ev-form" style="display:none;">
      <div class="staff-panel-title" id="eventFormTitle">Novi događaj</div>
      <input id="evTitle" list="evTitleList" maxlength="60" placeholder="Naziv, npr. Muzika uživo">
      <div class="ev-row">
        <input id="evDate" type="date" aria-label="Datum">
        <input id="evTime" type="time" aria-label="Vrijeme">
      </div>
      <select id="evLayout" aria-label="Raspored stolova"></select>
      <textarea id="evNote" rows="2" maxlength="300" placeholder="Napomena (nije obavezno)"></textarea>
      <div class="ev-row">
        <button type="button" class="btn" id="evCancel">Otkaži</button>
        <button type="button" class="btn primary" id="evSave">Sačuvaj</button>
      </div>
    </div>
    <button class="btn" id="pastEventsBtn" style="width:100%;margin-top:10px;">Prikaži prošle događaje</button>
    <datalist id="evTitleList"></datalist>
    <datalist id="tableList"></datalist>
  </section>
  <div class="toast" id="status" role="status" aria-live="polite"></div>
</div>

<script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",

</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, set, update } from 'firebase/database';

const firebaseConfig = {
    apiKey: "AIzaSyALY3oKvPW_mDZiaBl0EdFCkTjd6fqwisQ",
    authDomain: "kelt-pub-menu-2df61.firebaseapp.com",
    databaseURL: "https://kelt-pub-menu-2df61-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kelt-pub-menu-2df61",
    storageBucket: "kelt-pub-menu-2df61.firebasestorage.app"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

// Ime fajla planera smjena u istom folderu — promijeni ako se kod tebe drugačije zove.
const PLANER_FILE = 'smjene.html';

const urlParams = new URLSearchParams(window.location.search);
const tenantId = urlParams.get('tenant');
if(!tenantId){
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#ece5d8;background:#0f0d0b;min-height:100vh;">Nedostaje <code>?tenant=ID</code> u linku. Otvori rezervacije preko planera smjena ili KlikHub Hub-a.</div>';
  throw new Error('Missing tenant param');
}
document.querySelector('[data-nav="smjene"]').href = `${PLANER_FILE}?tenant=${encodeURIComponent(tenantId)}`;
document.querySelector('[data-nav="rez"]').href = `rezervacije.html?tenant=${encodeURIComponent(tenantId)}`;

let loaded = false; // upis je dozvoljen tek kad su događaji uspješno učitani

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function fmtKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtShort(d){
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.`;
}
// Množina za brojeve uz riječi (1 smjena, 2 smjene, 5 smjena)
function pl(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

let statusTimer = null;
function setStatus(msg, type){
  const el = document.getElementById('status');
  clearTimeout(statusTimer);
  if(!msg){ el.classList.remove('show'); return; }
  el.textContent = msg;
  el.className = type === 'err' ? 'toast err' : 'toast';
  void el.offsetWidth; // reflow — da se animacija ponovi i kad je toast već vidljiv
  el.classList.add('show');
  statusTimer = setTimeout(() => el.classList.remove('show'), type === 'err' ? 4500 : 2600);
}

// ========================================
// DOGAĐAJI I REZERVACIJE — podsjetnik za vlasnika (rezervacije.html).
// Planer smjena čita iste podatke samo za traku "Danas" i oznake u rasporedu.
// shiftSchedules/{tenant}/events/{id} = { title, date, time, note, layout, createdAt,
//   reservations: { rid: { name, guests, tables, tableIds:[...], createdAt } } }
// tableIds = stolovi označeni na šemi (nije obavezno). Dok ih nema, broji se polje tables.
// Upisuje se direktno na putanju, pa se ne miješa sa save() rasporeda.
// ========================================
let events = {};
let openEventId = null;
let editingEventId = null;
let editingResId = null;
let showPastEvents = false;
let assignResId = null;   // rezervacija kojoj se trenutno dodjeljuju stolovi na šemi
let pendingTables = [];   // stolovi dodirnuti za novu rezervaciju, prije upisa imena
let resDraft = null;      // ono što je već ukucano u formu, da se ne izgubi pri iscrtavanju
let dropDraft = false;    // poslije upisa/otkazivanja forma kreće prazna

// Šeme kafane (koordinate u viewBox 380×470). Stolovi zadržavaju broj kroz šeme.
const LAYOUTS = {
  standard: { name:'Standardni raspored', ...{"w":380,"h":470,"outline":[[6,8],[300,8],[300,106],[374,106],[374,460],[6,460]],"zones":[{"label":"WC i magacin","poly":[[154,136],[277,136],[277,264],[241,264],[241,324],[154,324]]},{"label":"Šank","x":133,"y":384,"w":207,"h":70},{"label":"Ulaz","x":10,"y":380,"w":70,"h":74}],"tables":[{"id":"1","shape":"round","x":49,"y":47,"w":34,"h":34,"rot":0},{"id":"2","shape":"round","x":103,"y":47,"w":34,"h":34,"rot":0},{"id":"3","shape":"rect","x":180,"y":44,"w":40,"h":28,"rot":0},{"id":"4","shape":"rect","x":247,"y":44,"w":40,"h":28,"rot":0},{"id":"5","shape":"rect","x":331,"y":132,"w":32,"h":36,"rot":0},{"id":"6","shape":"rect","x":331,"y":180,"w":32,"h":36,"rot":0},{"id":"7","shape":"rect","x":331,"y":230,"w":32,"h":36,"rot":0},{"id":"8","shape":"rect","x":331,"y":280,"w":32,"h":36,"rot":0},{"id":"9","shape":"rect","x":331,"y":330,"w":32,"h":36,"rot":0},{"id":"10","shape":"round","x":185,"y":117,"w":30,"h":30,"rot":0},{"id":"11","shape":"round","x":247,"y":117,"w":30,"h":30,"rot":0},{"id":"12","shape":"rect","x":197,"y":345,"w":36,"h":28,"rot":0},{"id":"13","shape":"round","x":52,"y":125,"w":34,"h":34,"rot":0},{"id":"14","shape":"rect","x":125,"y":185,"w":30,"h":30,"rot":45},{"id":"15","shape":"rect","x":125,"y":250,"w":30,"h":30,"rot":45},{"id":"16","shape":"rect","x":125,"y":315,"w":30,"h":30,"rot":45},{"id":"17","shape":"rect","x":24,"y":217,"w":33,"h":33,"rot":0},{"id":"18","shape":"rect","x":24,"y":282,"w":33,"h":33,"rot":0},{"id":"19","shape":"rect","x":27,"y":354,"w":34,"h":36,"rot":0}]} },
  muzika:   { name:'Raspored za muziku', ...{"w":380,"h":470,"outline":[[6,8],[300,8],[300,106],[374,106],[374,460],[6,460]],"zones":[{"label":"WC i magacin","poly":[[154,136],[277,136],[277,264],[241,264],[241,324],[154,324]]},{"label":"Šank","x":133,"y":384,"w":207,"h":70},{"label":"Ulaz","x":10,"y":380,"w":70,"h":74},{"label":"Muzika","x":22,"y":26,"w":110,"h":44,"accent":true}],"tables":[{"id":"3","shape":"rect","x":180,"y":44,"w":40,"h":28,"rot":0},{"id":"4","shape":"rect","x":247,"y":44,"w":40,"h":28,"rot":0},{"id":"5","shape":"rect","x":331,"y":132,"w":32,"h":36,"rot":0},{"id":"6","shape":"rect","x":331,"y":180,"w":32,"h":36,"rot":0},{"id":"7","shape":"rect","x":331,"y":230,"w":32,"h":36,"rot":0},{"id":"8","shape":"rect","x":331,"y":280,"w":32,"h":36,"rot":0},{"id":"9","shape":"rect","x":331,"y":330,"w":32,"h":36,"rot":0},{"id":"10","shape":"round","x":185,"y":117,"w":30,"h":30,"rot":0},{"id":"11","shape":"round","x":247,"y":117,"w":30,"h":30,"rot":0},{"id":"12","shape":"rect","x":197,"y":345,"w":36,"h":28,"rot":0},{"id":"14","shape":"rect","x":137.5,"y":195.5,"w":33,"h":33,"rot":0},{"id":"15","shape":"rect","x":137.5,"y":265.5,"w":33,"h":33,"rot":0},{"id":"17","shape":"rect","x":24,"y":217,"w":33,"h":33,"rot":0},{"id":"18","shape":"rect","x":24,"y":282,"w":33,"h":33,"rot":0},{"id":"19","shape":"rect","x":27,"y":354,"w":34,"h":36,"rot":0},{"id":"20","shape":"rect","x":38,"y":124,"w":32,"h":32,"rot":0},{"id":"21","shape":"rect","x":78,"y":124,"w":32,"h":32,"rot":0},{"id":"22","shape":"round","x":80,"y":178,"w":30,"h":30,"rot":0},{"id":"23","shape":"round","x":80,"y":240,"w":30,"h":30,"rot":0},{"id":"24","shape":"round","x":80,"y":302,"w":30,"h":30,"rot":0}]} }
};
const RES_COLORS = ['#2f8a63','#b0603a','#3d73b0','#8d5bb0','#b8902a','#2f9494','#b74a63','#6f9a2a','#a0662f','#5a6fc0'];
const DAY_SHORT = ['ned','pon','uto','sri','čet','pet','sub'];
const GUESTS_RE = /^\s*(\d{1,3})\s*(?:[-–]\s*(\d{1,3}))?\s*$/;

function evRef(sub){ return ref(db, `shiftSchedules/${tenantId}/events${sub || ''}`); }

async function loadEvents(){
  try{
    const snap = await get(evRef());
    events = snap.val() || {};
    return true;
  }catch(e){
    console.error('Događaji nisu učitani:', e);
    events = {};
    return false;
  }
}

async function evWrite(path, value){
  if(!loaded){ setStatus('Raspored nije učitan — izmjena nije sačuvana', 'err'); return false; }
  try{
    await set(evRef(path), value);
    return true;
  }catch(e){
    console.error(e);
    setStatus('Greška pri čuvanju', 'err');
    return false;
  }
}

function parseGuests(s){
  const m = String(s || '').match(GUESTS_RE);
  if(!m) return [0, 0];
  const a = +m[1], b = m[2] ? +m[2] : a;
  return [Math.min(a, b), Math.max(a, b)];
}
function resList(ev){
  return Object.entries(ev.reservations || {})
    .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
}
function guestTotal(ev){
  let lo = 0, hi = 0;
  resList(ev).forEach(([, r]) => { const [a, b] = parseGuests(r.guests); lo += a; hi += b; });
  return lo === hi ? `${lo}` : `${lo}–${hi}`;
}
// Broj stolova po rezervaciji (prazno = 1). Stare rezervacije nemaju polje, pa važe kao 1 sto.
function resTableIds(r){ return Array.isArray(r && r.tableIds) ? r.tableIds : []; }
function resTables(r){
  const ids = resTableIds(r);
  if(ids.length) return ids.length;
  const n = parseInt(r && r.tables, 10);
  return n > 0 ? n : 1;
}
function tablesLabel(ev){
  const n = resList(ev).reduce((sum, [, r]) => sum + resTables(r), 0);
  return `${n} ${pl(n, 'sto', 'stola', 'stolova')}`;
}
function unseatedCount(ev){ return resList(ev).filter(([, r]) => !resTableIds(r).length).length; }
function layoutOf(ev){ return LAYOUTS[ev && ev.layout] || LAYOUTS.standard; }
function sortIds(ids){ return [...ids].sort((a, b) => a.localeCompare(b, 'sr', { numeric:true })); }
function tablesText(ids){ return ids.length ? `${ids.length > 1 ? 'Stolovi' : 'Sto'} ${sortIds(ids).join(', ')}` : ''; }
// Naziv koji je ranije korišten pamti raspored (npr. "Muzika uživo" → muzika)
function guessLayout(title){
  const t = String(title || '').trim().toLowerCase();
  if(!t) return 'standard';
  const prev = Object.values(events)
    .filter(e => (e.title || '').trim().toLowerCase() === t && LAYOUTS[e.layout])
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
  if(prev) return prev.layout;
  return /muzik|bend|svirk|live|uživo/.test(t) ? 'muzika' : 'standard';
}

function renderPlan(ev){
  const L = layoutOf(ev);
  const list = resList(ev);
  const owner = {};
  list.forEach(([rid, r], i) => resTableIds(r).forEach(t => { owner[t] = { rid, color: RES_COLORS[i % RES_COLORS.length] }; }));
  const pts = a => a.map(p => p.join(',')).join(' ');
  let svg = `<svg viewBox="0 0 ${L.w} ${L.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Šema stolova">`;
  svg += `<polygon points="${pts(L.outline)}" fill="#1b1611" stroke="rgba(212,175,110,.35)" stroke-width="1.5"/>`;
  L.zones.forEach(z => {
    const fill = z.accent ? 'rgba(141,91,176,.35)' : '#2a231b';
    if(z.poly){
      const xs = z.poly.map(p => p[0]), ys = z.poly.map(p => p[1]);
      svg += `<polygon points="${pts(z.poly)}" fill="${fill}" stroke="rgba(212,175,110,.25)"/>`;
      svg += `<text x="${(Math.min(...xs) + Math.max(...xs)) / 2}" y="${(Math.min(...ys) + Math.max(...ys)) / 2}" fill="#9c9184" font-size="12" text-anchor="middle" font-family="-apple-system,sans-serif">${esc(z.label)}</text>`;
    } else {
      svg += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="5" fill="${fill}" stroke="rgba(212,175,110,.25)"/>`;
      svg += `<text x="${z.x + z.w / 2}" y="${z.y + z.h / 2 + 4}" fill="${z.accent ? '#d9c2ea' : '#9c9184'}" font-size="12" text-anchor="middle" font-family="-apple-system,sans-serif">${esc(z.label)}</text>`;
    }
  });
  L.tables.forEach(t => {
    const o = owner[t.id];
    const pending = !o && pendingTables.includes(t.id);
    const active = o && o.rid === assignResId;
    const fill = o ? o.color : pending ? 'rgba(201,161,90,.35)' : '#241e16';
    const stroke = active ? '#ffffff' : o ? 'rgba(255,255,255,.35)' : pending ? '#e6c17a' : '#6b5a3c';
    const sw = active ? 3 : pending ? 2.5 : 1.5;
    const dash = pending ? ' stroke-dasharray="4 3"' : '';
    const shape = t.shape === 'round'
      ? `<circle cx="${t.x}" cy="${t.y}" r="${t.w / 2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>`
      : `<rect x="${t.x - t.w / 2}" y="${t.y - t.h / 2}" width="${t.w}" height="${t.h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}${t.rot ? ` transform="rotate(${t.rot} ${t.x} ${t.y})"` : ''}/>`;
    // Nevidljiva veća površina za lakši dodir prstom
    svg += `<g class="tb" data-tid="${esc(t.id)}"><circle cx="${t.x}" cy="${t.y}" r="24" fill="transparent"/>${shape}<text x="${t.x}" y="${t.y + 4.5}" fill="#f4ede2" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif" pointer-events="none">${esc(t.id)}</text></g>`;
  });
  return svg + '</svg>';
}

function onTableTap(evId, tid){
  const ev = events[evId];
  if(!ev) return;
  if(!ev.reservations) ev.reservations = {};
  const ownerEntry = resList(ev).find(([, r]) => resTableIds(r).includes(tid));

  if(assignResId && ev.reservations[assignResId]){
    const r = ev.reservations[assignResId];
    let ids = [...resTableIds(r)];
    if(ownerEntry && ownerEntry[0] === assignResId){
      ids = ids.filter(x => x !== tid);
    } else {
      if(ownerEntry){
        const [orid, or] = ownerEntry;
        if(!confirm(`Sto ${tid} je za ${or.name}. Prebaciti ga na ${r.name}?`)) return;
        or.tableIds = resTableIds(or).filter(x => x !== tid);
        evWrite(`/${evId}/reservations/${orid}/tableIds`, or.tableIds.length ? or.tableIds : null);
      }
      ids.push(tid);
    }
    r.tableIds = sortIds(ids);
    renderEventsList();
    renderTodayEvents();
    evWrite(`/${evId}/reservations/${assignResId}/tableIds`, r.tableIds.length ? r.tableIds : null);
    return;
  }
  if(ownerEntry){
    // Zauzet sto: otvori premještanje za tu rezervaciju
    assignResId = ownerEntry[0];
    pendingTables = [];
    renderEventsList();
    setStatus(`Sto ${tid}: ${ownerEntry[1].name} (${ownerEntry[1].guests}). Dodiruj stolove da promijeniš.`);
    return;
  }
  // Slobodan sto: priprema za novu rezervaciju
  pendingTables = pendingTables.includes(tid) ? pendingTables.filter(x => x !== tid) : sortIds([...pendingTables, tid]);
  editingResId = null;
  renderEventsList();
  if(pendingTables.length){
    const n = document.getElementById('resName');
    if(n && !n.value) n.focus({ preventScroll:true });
  }
}
function evSortKey(e){ return (e.date || '') + (e.time || '99:99'); }
function eventsOn(dateStr){
  return Object.entries(events)
    .filter(([, e]) => e.date === dateStr)
    .sort((a, b) => evSortKey(a[1]).localeCompare(evSortKey(b[1])));
}
function evDateLabel(e){
  const d = new Date(e.date + 'T00:00:00');
  return `${DAY_SHORT[d.getDay()]} ${fmtShort(d)}${e.time ? ' · ' + e.time : ''}`;
}

// Ponuda ranije upisanih stolova i naziva događaja — sljedeći put se samo izaberu.
function fillDatalists(){
  const tables = new Set(), titles = new Set();
  Object.values(events).forEach(e => {
    if(e.title) titles.add(e.title);
    Object.values(e.reservations || {}).forEach(r => { if(r.table) tables.add(r.table); });
  });
  const opts = set => [...set].sort((a, b) => a.localeCompare(b, 'sr'))
    .map(v => `<option value="${esc(v)}"></option>`).join('');
  document.getElementById('tableList').innerHTML = opts(tables);
  document.getElementById('evTitleList').innerHTML = opts(titles);
}

function renderTodayEvents(){
  const el = document.getElementById('todayEvents');
  const list = eventsOn(fmtKey(new Date()));
  el.innerHTML = list.map(([id, e]) => {
    const n = resList(e).length;
    return `<button type="button" class="today-event" data-ev="${esc(id)}">🔔 Danas: <b>${esc(e.title)}</b>${e.time ? ' u ' + esc(e.time) : ''} · <b>${tablesLabel(e)}</b>${n ? ' · ' + guestTotal(e) + ' osoba' : ''}</button>`;
  }).join('');
  el.querySelectorAll('[data-ev]').forEach(b => b.addEventListener('click', () => {
    openEventId = b.dataset.ev;
    renderEventsList();
    requestAnimationFrame(() => {
      const card = document.querySelector(`.ev-card[data-ev="${CSS.escape(openEventId)}"]`);
      if(card) card.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  }));
}

function refreshEventViews(){
  renderEventsList();
  renderTodayEvents();
}

function renderEventsList(){
  fillDatalists();
  const nameEl = document.getElementById('resName');
  if(dropDraft){ resDraft = null; dropDraft = false; }
  else if(nameEl && !editingResId){
    resDraft = {
      name: nameEl.value,
      guests: document.getElementById('resGuests').value,
      tables: document.getElementById('resTables') ? document.getElementById('resTables').value : ''
    };
  }
  const el = document.getElementById('eventsList');
  const today = fmtKey(new Date());
  const all = Object.entries(events).sort((a, b) => evSortKey(a[1]).localeCompare(evSortKey(b[1])));
  const upcoming = all.filter(([, e]) => e.date >= today);
  const past = all.filter(([, e]) => e.date < today).reverse().slice(0, 15);
  const shown = showPastEvents ? [...upcoming, ...past] : upcoming;

  document.getElementById('pastEventsBtn').textContent =
    showPastEvents ? 'Sakrij prošle događaje' : 'Prikaži prošle događaje';
  document.getElementById('pastEventsBtn').style.display = past.length ? '' : 'none';

  if(!shown.length){
    el.innerHTML = '<div class="stats-empty" style="margin-bottom:12px;">Nema zakazanih događaja.</div>';
    return;
  }

  el.innerHTML = shown.map(([id, e]) => {
    const isOpen = id === openEventId;
    const isPast = e.date < today;
    const list = resList(e);
    const head = `<div class="ev-head" data-toggle="${esc(id)}">
        <span class="ev-title">${esc(e.title)}</span>
        <span class="ev-meta">${esc(evDateLabel(e))}<br><b style="color:var(--gold-bright);">${tablesLabel(e)}</b></span>
      </div>`;
    if(!isOpen) return `<div class="ev-card${isPast ? ' past' : ''}" data-ev="${esc(id)}">${head}</div>`;

    const editRes = editingResId && e.reservations && e.reservations[editingResId];
    const draft = editRes
      ? { name: editRes.name, guests: editRes.guests, tables: !resTableIds(editRes).length && resTables(editRes) > 1 ? resTables(editRes) : '' }
      : (resDraft || { name:'', guests:'', tables:'' });
    const assignRes = assignResId && e.reservations && e.reservations[assignResId];
    const unseated = unseatedCount(e);
    const rows = list.length
      ? list.map(([rid, r], i) => {
          const ids = resTableIds(r);
          const n = resTables(r);
          return `
          <div class="res-row${rid === assignResId ? ' assigning' : ''}">
            <div class="res-main">
              <span class="res-dot" style="background:${ids.length ? RES_COLORS[i % RES_COLORS.length] : 'transparent'};border:1px solid ${ids.length ? 'transparent' : 'var(--line)'};"></span><b>${esc(r.name)}</b> · ${esc(r.guests)}${!ids.length && n > 1 ? ` · <b style="color:var(--gold);">${n} ${pl(n, 'sto', 'stola', 'stolova')}</b>` : ''}
              ${ids.length ? `<span class="res-table">🪑 ${esc(tablesText(ids))}</span>` : `<span class="res-notable">bez stola</span>`}
              ${r.table ? `<span class="res-table">${esc(r.table)}</span>` : ''}
            </div>
            <button type="button" class="res-btn" data-assign-res="${esc(rid)}" title="Stolovi na šemi">🪑</button>
            <button type="button" class="res-btn" data-edit-res="${esc(rid)}" title="Izmijeni">✏️</button>
            <button type="button" class="res-btn" data-del-res="${esc(rid)}" title="Obriši">✕</button>
          </div>`;
        }).join('')
      : '<div class="ev-empty">Još nema rezervacija.</div>';

    return `<div class="ev-card open${isPast ? ' past' : ''}" data-ev="${esc(id)}">
      ${head}
      <div class="ev-body">
        ${e.note ? `<div class="ev-note">${esc(e.note)}</div>` : ''}
        ${assignRes
          ? `<div class="assign-bar"><span>🪑 Dodiruj stolove za <b>${esc(assignRes.name)}</b></span><button type="button" class="btn primary" id="assignDone">Gotovo</button></div>`
          : ''}
        <div class="ev-plan" data-plan="${esc(id)}">${renderPlan(e)}</div>
        ${assignRes ? '' : `<div class="ev-plan-hint">${esc(layoutOf(e).name)} · dodirni slobodan sto za novu rezervaciju, a zauzet da ga premjestiš.</div>`}
        ${rows}
        ${list.length ? `<div class="ev-total">Ukupno: <b>${tablesLabel(e)}</b> · ${guestTotal(e)} osoba${unseated ? ` · <span style="color:#d99b8a;">${unseated} bez stola</span>` : ''}</div>` : ''}
        <div class="res-form">
          <div class="ev-row">
            <input id="resName" maxlength="40" placeholder="Ime" value="${esc(draft.name)}">
            <input id="resGuests" maxlength="9" inputmode="tel" placeholder="Osoba: 3 ili 4-6" value="${esc(draft.guests)}">
          </div>
          ${!editRes && pendingTables.length
            ? `<div class="pending-tables">🪑 ${esc(tablesText(pendingTables))}<button type="button" id="pendingClear">Poništi</button></div>`
            : (editRes && resTableIds(editRes).length
              ? `<div class="pending-tables">🪑 ${esc(tablesText(resTableIds(editRes)))} — mijenja se na šemi (🪑)</div>`
              : `<input id="resTables" type="number" inputmode="numeric" min="1" max="20" placeholder="Broj stolova (ako nije 1)" aria-label="Broj stolova" value="${esc(draft.tables)}">`)}
          <div class="ev-row">
            ${editRes ? '<button type="button" class="btn" id="resCancel">Otkaži</button>' : ''}
            <button type="button" class="btn primary" id="resSave">${editRes ? 'Sačuvaj izmjenu' : '+ Dodaj rezervaciju'}</button>
          </div>
        </div>
        <div class="ev-actions">
          <button type="button" class="btn" data-link-ev="${esc(id)}">🔗 Link za pregled</button>
          <button type="button" class="btn" data-share-ev="${esc(id)}">📲 Pošalji listu</button>
          <button type="button" class="btn" data-edit-ev="${esc(id)}">✏️ Uredi događaj</button>
          <button type="button" class="btn danger" data-del-ev="${esc(id)}">Obriši</button>
        </div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-toggle]').forEach(h => h.addEventListener('click', () => {
    const id = h.dataset.toggle;
    openEventId = openEventId === id ? null : id;
    editingResId = null;
    assignResId = null;
    pendingTables = [];
    dropDraft = true;
    renderEventsList();
  }));

  if(!openEventId || !events[openEventId]) return;
  const evId = openEventId;
  const ev = events[evId];

  const plan = el.querySelector('[data-plan]');
  if(plan) plan.addEventListener('click', e => {
    const g = e.target.closest('[data-tid]');
    if(g) onTableTap(evId, g.dataset.tid);
  });
  const done = document.getElementById('assignDone');
  if(done) done.addEventListener('click', () => { assignResId = null; renderEventsList(); });
  const pc = document.getElementById('pendingClear');
  if(pc) pc.addEventListener('click', () => { pendingTables = []; renderEventsList(); });
  el.querySelectorAll('[data-assign-res]').forEach(b => b.addEventListener('click', () => {
    const rid = b.dataset.assignRes;
    assignResId = assignResId === rid ? null : rid;
    pendingTables = [];
    editingResId = null;
    renderEventsList();
    if(assignResId){
      const p = el.querySelector('[data-plan]');
      if(p) p.scrollIntoView({ behavior:'smooth', block:'center' });
    }
  }));

  el.querySelectorAll('[data-edit-res]').forEach(b => b.addEventListener('click', () => {
    editingResId = b.dataset.editRes;
    assignResId = null;
    pendingTables = [];
    renderEventsList();
    document.getElementById('resName').focus();
  }));
  el.querySelectorAll('[data-del-res]').forEach(b => b.addEventListener('click', async () => {
    const rid = b.dataset.delRes;
    const r = ev.reservations[rid];
    if(!confirm(`Obrisati rezervaciju "${r.name}"?`)) return;
    delete ev.reservations[rid];
    if(editingResId === rid) editingResId = null;
    if(assignResId === rid) assignResId = null;
    refreshEventViews();
    if(await evWrite(`/${evId}/reservations/${rid}`, null)) setStatus('Rezervacija obrisana ✓');
  }));

  const cancel = document.getElementById('resCancel');
  if(cancel) cancel.addEventListener('click', () => { editingResId = null; dropDraft = true; renderEventsList(); });

  document.getElementById('resSave').addEventListener('click', async () => {
    const name = document.getElementById('resName').value.trim();
    const guests = document.getElementById('resGuests').value.trim().replace(/\s*[-–]\s*/, '-');
    const tablesEl = document.getElementById('resTables');
    const tablesRaw = tablesEl ? tablesEl.value.trim() : '';
    const tables = tablesRaw ? parseInt(tablesRaw, 10) : 1;
    if(!(tables >= 1 && tables <= 20)){
      setStatus('Broj stolova: od 1 do 20', 'err');
      if(tablesEl) tablesEl.focus();
      return;
    }
    if(!name){ setStatus('Upiši ime', 'err'); document.getElementById('resName').focus(); return; }
    if(!GUESTS_RE.test(guests)){
      setStatus('Broj osoba: npr. 3 ili 4-6', 'err');
      document.getElementById('resGuests').focus();
      return;
    }
    if(!ev.reservations) ev.reservations = {};
    const rid = editingResId || ('r' + Date.now());
    const prev = ev.reservations[rid] || {};
    const tableIds = editingResId ? resTableIds(prev) : [...pendingTables];
    const data = { name, guests, tables: tableIds.length || tables, createdAt: prev.createdAt || Date.now() };
    if(tableIds.length) data.tableIds = tableIds;
    if(prev.table) data.table = prev.table; // stari opis stola ostaje
    ev.reservations[rid] = data;
    const wasEdit = !!editingResId;
    editingResId = null;
    pendingTables = [];
    dropDraft = true;
    refreshEventViews();
    if(await evWrite(`/${evId}/reservations/${rid}`, data)){
      setStatus(wasEdit ? 'Rezervacija izmijenjena ✓' : `${name} upisan/a ✓`);
    }
  });

  el.querySelector('[data-share-ev]').addEventListener('click', () => shareEventList(ev));
  el.querySelector('[data-link-ev]').addEventListener('click', () => shareViewLink(evId));
  el.querySelector('[data-edit-ev]').addEventListener('click', () => openEventForm(evId));
  el.querySelector('[data-del-ev]').addEventListener('click', async () => {
    const n = resList(ev).length;
    if(!confirm(`Obrisati događaj "${ev.title}"${n ? ` i rezervacije (${tablesLabel(ev)})` : ''}?`)) return;
    delete events[evId];
    openEventId = null;
    refreshEventViews();
    if(await evWrite(`/${evId}`, null)) setStatus('Događaj obrisan ✓');
  });
}

// Link samo za pregled: pregled.html prati događaj uživo, bez mogućnosti izmjene.
// Ključ (shareToken) se pravi jednom po događaju, pa poslani link uvijek ostaje isti.
function shareViewLink(evId){
  const ev = events[evId];
  if(!ev) return;
  const isNew = !ev.shareToken;
  if(isNew) ev.shareToken = crypto.randomUUID().replace(/-/g, '').slice(0, 16);
  const url = new URL(`pregled.html?tenant=${encodeURIComponent(tenantId)}&ev=${encodeURIComponent(evId)}&k=${ev.shareToken}`, location.href).href;
  const text = `📅 ${ev.title} — ${evDateLabel(ev)}\nRaspored stolova i rezervacije (uvijek ažurno):\n${url}`;
  // Dijeljenje kreće odmah, dok klik još važi; ključ se upisuje paralelno.
  if(navigator.share){
    navigator.share({ text }).catch(e => { if(e.name !== 'AbortError') console.error(e); });
  } else {
    navigator.clipboard.writeText(text)
      .then(() => setStatus('Link kopiran ✓ — zalijepi u Viber'))
      .catch(() => prompt('Kopiraj link:', url));
  }
  if(isNew){
    evWrite(`/${evId}/shareToken`, ev.shareToken).then(ok => {
      if(!ok){ delete ev.shareToken; setStatus('Link nije sačuvan — pokušaj ponovo', 'err'); }
    });
  }
}

// Lista za konobare — tekst za Viber grupu
function shareEventList(ev){
  const lines = [`📅 ${ev.title} — ${evDateLabel(ev)}`];
  if(ev.note) lines.push(ev.note);
  lines.push('');
  const list = resList(ev);
  if(list.length){
    list.forEach(([, r]) => {
      const ids = resTableIds(r);
      const n = resTables(r);
      const where = ids.length ? ' — ' + tablesText(ids).toLowerCase() : (n > 1 ? ` · ${n} ${pl(n, 'sto', 'stola', 'stolova')}, bez stola` : ' — bez stola');
      lines.push(`• ${r.name} (${r.guests})${where}`);
    });
    lines.push('', `Ukupno: ${tablesLabel(ev)} · ${guestTotal(ev)} osoba`);
  } else {
    lines.push('Još nema rezervacija.');
  }
  const text = lines.join('\n');
  if(navigator.share){
    navigator.share({ text }).catch(e => { if(e.name !== 'AbortError') console.error(e); });
    return;
  }
  navigator.clipboard.writeText(text)
    .then(() => setStatus('Lista kopirana ✓ — zalijepi u Viber'))
    .catch(() => prompt('Kopiraj listu:', text));
}

function openEventForm(id){
  editingEventId = id || null;
  const e = id ? events[id] : null;
  document.getElementById('eventFormTitle').textContent = e ? 'Uredi događaj' : 'Novi događaj';
  document.getElementById('evTitle').value = e ? e.title : '';
  document.getElementById('evDate').value = e ? e.date : fmtKey(new Date());
  document.getElementById('evTime').value = e ? (e.time || '') : '';
  document.getElementById('evNote').value = e ? (e.note || '') : '';
  document.getElementById('evLayout').innerHTML = Object.entries(LAYOUTS)
    .map(([k, l]) => `<option value="${k}">🪑 ${esc(l.name)}</option>`).join('');
  document.getElementById('evLayout').value = e ? (LAYOUTS[e.layout] ? e.layout : 'standard') : 'standard';
  layoutTouched = !!e;
  const form = document.getElementById('eventForm');
  form.style.display = '';
  document.getElementById('newEventBtn').style.display = 'none';
  requestAnimationFrame(() => {
    form.scrollIntoView({ behavior:'smooth', block:'start' });
    document.getElementById('evTitle').focus();
  });
}
function closeEventForm(){
  editingEventId = null;
  document.getElementById('eventForm').style.display = 'none';
  document.getElementById('newEventBtn').style.display = '';
}

let layoutTouched = false;
document.getElementById('newEventBtn').addEventListener('click', () => openEventForm(null));
document.getElementById('evLayout').addEventListener('change', () => { layoutTouched = true; });
// Dok raspored nije ručno biran, ponudi onaj koji je korišten uz isti naziv
document.getElementById('evTitle').addEventListener('input', () => {
  if(!layoutTouched) document.getElementById('evLayout').value = guessLayout(document.getElementById('evTitle').value);
});
document.getElementById('evCancel').addEventListener('click', closeEventForm);
document.getElementById('pastEventsBtn').addEventListener('click', () => {
  showPastEvents = !showPastEvents;
  renderEventsList();
});
document.getElementById('evSave').addEventListener('click', async () => {
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  const time = document.getElementById('evTime').value;
  const note = document.getElementById('evNote').value.trim();
  const layout = LAYOUTS[document.getElementById('evLayout').value] ? document.getElementById('evLayout').value : 'standard';
  if(!title){ setStatus('Upiši naziv događaja', 'err'); document.getElementById('evTitle').focus(); return; }
  if(!date){ setStatus('Izaberi datum', 'err'); return; }

  const id = editingEventId || ('e' + Date.now());
  const prev = events[id] || {};
  // Ako se promijeni raspored, stolovi kojih u novom nema skidaju se sa rezervacija
  const valid = new Set(LAYOUTS[layout].tables.map(t => t.id));
  let dropped = 0;
  const reservations = prev.reservations || {};
  Object.values(reservations).forEach(r => {
    const ids = resTableIds(r);
    const keep = ids.filter(t => valid.has(t));
    if(keep.length !== ids.length){
      dropped += ids.length - keep.length;
      if(keep.length) r.tableIds = keep; else { delete r.tableIds; r.tables = ids.length; }
    }
  });
  const data = {
    ...(prev.shareToken ? { shareToken: prev.shareToken } : {}),
    title, date, time, note, layout,
    createdAt: prev.createdAt || Date.now(),
    reservations
  };
  const wasEdit = !!editingEventId;
  events[id] = data;
  openEventId = id;
  closeEventForm();
  refreshEventViews();
  const ok = wasEdit
    ? await (async () => {
        if(!loaded){ setStatus('Raspored nije učitan — izmjena nije sačuvana', 'err'); return false; }
        // Samo osnovna polja — rezervacije se ne diraju
        try{
          const patch = { title, date, time, note, layout };
          if(dropped) patch.reservations = reservations;
          await update(evRef(`/${id}`), patch);
          return true;
        }
        catch(e){ console.error(e); setStatus('Greška pri čuvanju', 'err'); return false; }
      })()
    : await evWrite(`/${id}`, data);
  if(ok) setStatus(wasEdit
    ? (dropped ? `Događaj izmijenjen ✓ — ${dropped} ${pl(dropped, 'sto ne postoji', 'stola ne postoje', 'stolova ne postoji')} u novom rasporedu, provjeri „bez stola“` : 'Događaj izmijenjen ✓')
    : `${title} dodan ✓ — dodirni sto na šemi ili upiši rezervaciju`);
});


async function load(){
  document.getElementById('eventsList').innerHTML = '<div class="stats-empty">Učitavam…</div>';
  loaded = await loadEvents();
  if(!loaded) setStatus('Rezervacije nisu učitane — osvježi stranicu. Izmjene su blokirane.', 'err');
  try{
    const nameSnap = await get(ref(db, `klikhub/tenants/${tenantId}/name`));
    if(nameSnap.exists() && nameSnap.val()){
      document.getElementById('brandSub').textContent = `${nameSnap.val()} · KlikHub`;
      document.title = `Rezervacije — ${nameSnap.val()}`;
    }
  }catch(e){ console.error(e); }
  // Link iz planera (traka "Danas") otvara tačno taj događaj
  const evParam = urlParams.get('ev');
  if(evParam && events[evParam]){
    openEventId = evParam;
    if(events[evParam].date < fmtKey(new Date())) showPastEvents = true;
  }
  renderTodayEvents();
  renderEventsList();
  if(openEventId){
    requestAnimationFrame(() => {
      const card = document.querySelector(`.ev-card[data-ev="${CSS.escape(openEventId)}"]`);
      if(card) card.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  }
}
load();
</script>
</body>
</html>
