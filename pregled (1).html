<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d0b">
<meta name="robots" content="noindex">
<title>Rezervacije — pregled</title>
<style>
  :root{
    --bg: #0f0d0b;
    --bg-panel: #16130f;
    --line: rgba(212,175,110,0.16);
    --gold: #c9a15a;
    --gold-bright: #e6c17a;
    --text: #ece5d8;
    --text-dim: #9c9184;
    --shift1: #2f4d3a;
    --shift2: #4a2f2f;
    --warn: #c96a5a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, rgba(201,161,90,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  header{
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:16px;
  }
  h1{
    font-size:1.4rem;
    margin:0;
    letter-spacing:0.03em;
    font-weight:600;
    color:var(--gold-bright);
  }
  h1 .sub{
    display:block;
    font-family: -apple-system, sans-serif;
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:4px;
    font-weight:400;
  }
  .staff-panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin:18px 0;
  }
  .staff-panel-title{
    font-family:-apple-system, sans-serif;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  select{
    width:100%;background:#1c1712;border:1px solid var(--line);color:var(--text);
    padding:7px 8px;border-radius:6px;font-family:-apple-system, sans-serif;
    font-size:0.85rem;outline:none;
  }
  select:focus{border-color:var(--gold);}
  .btn{
    font-family:-apple-system, sans-serif;font-size:0.8rem;background:#1c1712;
    border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:7px;cursor:pointer;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn.primary{
    background:linear-gradient(135deg, #6b4f27, #4a3618);
    border-color:var(--gold);color:var(--gold-bright);
  }
  .hint{font-family:-apple-system, sans-serif;font-size:0.72rem;color:var(--text-dim);margin-top:10px;line-height:1.5;}
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    transform:translate(-50%, 14px);z-index:2000;
    max-width:min(430px, calc(100vw - 32px));
    background:#241d15;border:1px solid var(--gold);color:var(--text);
    font-family:-apple-system, sans-serif;font-size:0.84rem;line-height:1.35;
    padding:12px 18px;border-radius:12px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%, 0);}
  .toast.err{background:#2b1a16;border-color:var(--warn);color:#f2c8bd;}
  .btn.danger{color:#d58a7a;border-color:rgba(201,106,90,0.3);}
  .btn.danger:hover{border-color:var(--warn);color:#e8a595;}
  .stats-empty{font-family:-apple-system, sans-serif;font-size:0.8rem;color:var(--text-dim);padding:8px 0;}
  /* Centralno mjesto: kartice na vrhu + traka "Danas" */
  .tabbar{display:flex;gap:6px;margin:14px 0 4px;}
  .tabbar a,.tabbar button{
    display:block;text-align:center;text-decoration:none;
    flex:1;background:#1c1712;border:1px solid var(--line);color:var(--text-dim);
    font-family:-apple-system,sans-serif;font-size:.86rem;font-weight:600;
    padding:11px 8px;border-radius:9px;cursor:pointer;
  }
  .tabbar a.on,.tabbar button.on{background:rgba(201,161,90,0.16);border-color:var(--gold);color:var(--gold-bright);}
  #todayEvents:empty{display:none;}
  #todayEvents{margin-top:14px;}
  .today-event{
    text-decoration:none;
    display:block;width:100%;text-align:left;background:rgba(201,161,90,0.12);
    border:1px solid var(--gold);color:var(--gold-bright);font-family:-apple-system,sans-serif;
    font-size:.86rem;line-height:1.4;padding:11px 14px;border-radius:9px;margin-bottom:8px;cursor:pointer;
  }
  .ev-tag{display:block;margin-top:4px;font-family:-apple-system,sans-serif;font-size:.7rem;font-weight:400;color:var(--gold);white-space:normal;}

  /* Događaji i rezervacije */
  .ev-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;}
  .ev-card.open{border-color:var(--gold);}
  .ev-card.past{opacity:.7;}
  .ev-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:13px 14px;cursor:pointer;font-family:-apple-system,sans-serif;}
  .ev-title{color:var(--gold-bright);font-weight:700;font-size:.95rem;}
  .ev-meta{color:var(--text-dim);font-size:.76rem;text-align:right;flex-shrink:0;}
  .ev-body{padding:0 14px 14px;font-family:-apple-system,sans-serif;}
  .ev-note{font-size:.82rem;color:var(--text);background:#1e1a14;border-radius:7px;padding:9px 11px;margin-bottom:8px;line-height:1.45;white-space:pre-wrap;}
  .ev-total{font-size:.8rem;color:var(--gold);margin:10px 0 2px;}
  .ev-empty{font-size:.8rem;color:var(--text-dim);padding:8px 0;}
  .res-row{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
  .res-main{flex:1;min-width:0;}
  .res-table{display:block;color:var(--text-dim);font-size:.76rem;margin-top:2px;}
  .res-btn{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    width:38px;height:38px;border-radius:8px;cursor:pointer;flex-shrink:0;font-size:.9rem;
  }
  .ev-form,.res-form{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .ev-row{display:flex;gap:8px;}
  .ev-row > *{flex:1;min-width:0;}
  .ev-form input,.ev-form textarea,.res-form input{
    width:100%;background:#1c1712;border:1px solid var(--line);color:var(--text);
    padding:11px;border-radius:7px;font-family:-apple-system,sans-serif;font-size:1rem;outline:none;
  }
  .ev-form input:focus,.ev-form textarea:focus,.res-form input:focus{border-color:var(--gold);}
  .ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .ev-plan{background:#14110d;border:1px solid var(--line);border-radius:9px;margin:2px 0 10px;padding:4px;}
  .ev-plan svg{width:100%;height:auto;display:block;touch-action:manipulation;}
  .ev-plan .tb{cursor:pointer;}
  .ev-plan-hint{font-size:.74rem;color:var(--text-dim);margin:-4px 0 10px;line-height:1.4;}
  .assign-bar{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:rgba(201,161,90,.14);border:1px solid var(--gold);border-radius:8px;
    padding:8px 10px;font-size:.84rem;color:var(--gold-bright);margin-bottom:8px;
  }
  .assign-bar .btn{padding:7px 12px;}
  .res-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .res-row.assigning{background:rgba(201,161,90,.09);border-radius:6px;}
  .res-notable{color:#d99b8a;font-size:.76rem;display:block;margin-top:2px;}
  .pending-tables{font-size:.82rem;color:var(--gold-bright);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pending-tables button{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:7px;padding:5px 9px;cursor:pointer;}
  .live{font-family:-apple-system,sans-serif;font-size:.72rem;color:var(--text-dim);margin-top:6px;}
  .live b{color:#8fbf9d;font-weight:600;}
  .req-form{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .req-form input,.req-form textarea{
    width:100%;background:#1c1712;border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:8px;font-family:-apple-system,sans-serif;font-size:1rem;outline:none;
  }
  .req-form input:focus,.req-form textarea:focus{border-color:var(--gold);}
  .req-form .row{display:flex;gap:8px;}
  .req-form .row > *{flex:1;min-width:0;}
  .req-form label{font-family:-apple-system,sans-serif;font-size:.76rem;color:var(--text-dim);margin-top:4px;}
  .req-tables{font-family:-apple-system,sans-serif;font-size:.86rem;color:var(--gold-bright);min-height:20px;}
  .req-row{font-family:-apple-system,sans-serif;font-size:.86rem;padding:8px 0;border-bottom:1px solid var(--line);}
  .req-row:last-child{border-bottom:none;}
  .req-row small{display:block;color:var(--text-dim);font-size:.74rem;margin-top:2px;}
  .cap-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-family:-apple-system,sans-serif;font-size:.84rem;color:var(--text);}
  .res-note{display:block;color:var(--text-dim);font-size:.76rem;margin-top:2px;font-style:italic;}
  .view-msg{font-family:-apple-system,sans-serif;color:var(--text-dim);padding:30px 4px;text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="evTitle">Rezervacije<span class="sub" id="brandSub">Pregled</span></h1>
    <div class="live" id="live">Učitavam…</div>
  </header>
  <div id="view"></div>
  <div id="reqWrap" style="display:none;">
    <button type="button" class="btn primary" id="reqOpen" style="width:100%;margin-top:12px;padding:14px;font-size:.95rem;">➕ Prijavi rezervaciju</button>
    <div class="staff-panel req-form" id="reqForm" style="display:none;">
      <div class="staff-panel-title">Nova rezervacija — šalje se Žarku na potvrdu</div>
      <div class="row">
        <input id="qGuest" maxlength="40" placeholder="Ime gosta">
        <input id="qGuests" maxlength="9" inputmode="tel" placeholder="Osoba: 3 ili 4-6">
      </div>
      <label>Sto (nije obavezno) — dodirni slobodan sto na šemi</label>
      <div class="req-tables" id="qTables">—</div>
      <input id="qNote" maxlength="200" placeholder="Napomena (nije obavezno)">
      <input id="qBy" maxlength="30" placeholder="Tvoje ime">
      <div class="row">
        <button type="button" class="btn" id="reqCancel">Otkaži</button>
        <button type="button" class="btn primary" id="reqSend">Pošalji</button>
      </div>
    </div>
  </div>
  <div class="toast" id="status" role="status" aria-live="polite"></div>
</div>

// SAMO PREGLED — nema upisa u bazu. Stranica prati događaj uživo (onValue),

// renderPlan iz rezervacija očekuje ova dva stanja. U pregledu se ništa ne mijenja,

function showInfo(html){

  clearTimeout(infoTimer);
  el.innerHTML = html;
  el.className = 'toast';
  void el.offsetWidth;
  el.classList.add('show');
  infoTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

// Množina za brojeve uz riječi (1 smjena, 2 smjene, 5 smjena)
function pl(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

  muzika:   { name:'Raspored za muziku', ...{"w":380,"h":470,"outline":[[6,8],[300,8],[300,106],[374,106],[374,460],[6,460]],"zones":[{"label":"WC i magacin","poly":[[154,136],[277,136],[277,264],[241,264],[241,324],[154,324]]},{"label":"Ulaz","x":10,"y":380,"w":70,"h":74},{"label":"Muzika","x":22,"y":26,"w":110,"h":44,"accent":true}],"tables":[{"id":"3","shape":"rect","x":180,"y":44,"w":40,"h":28,"rot":0},{"id":"4","shape":"rect","x":247,"y":44,"w":40,"h":28,"rot":0},{"id":"5","shape":"rect","x":331,"y":132,"w":32,"h":36,"rot":0},{"id":"6","shape":"rect","x":331,"y":180,"w":32,"h":36,"rot":0},{"id":"7","shape":"rect","x":331,"y":230,"w":32,"h":36,"rot":0},{"id":"8","shape":"rect","x":331,"y":280,"w":32,"h":36,"rot":0},{"id":"9","shape":"rect","x":331,"y":330,"w":32,"h":36,"rot":0},{"id":"10","shape":"round","x":185,"y":117,"w":30,"h":30,"rot":0},{"id":"11","shape":"round","x":247,"y":117,"w":30,"h":30,"rot":0},{"id":"12","shape":"rect","x":197,"y":345,"w":36,"h":28,"rot":0},{"id":"14","shape":"rect","x":137.5,"y":195.5,"w":33,"h":33,"rot":0},{"id":"15","shape":"rect","x":137.5,"y":265.5,"w":33,"h":33,"rot":0},{"id":"17","shape":"rect","x":24,"y":217,"w":33,"h":33,"rot":0},{"id":"18","shape":"rect","x":24,"y":282,"w":33,"h":33,"rot":0},{"id":"19","shape":"rect","x":27,"y":354,"w":34,"h":36,"rot":0},{"id":"20","shape":"rect","x":38,"y":124,"w":32,"h":32,"rot":0},{"id":"21","shape":"rect","x":78,"y":124,"w":32,"h":32,"rot":0},{"id":"22","shape":"round","x":80,"y":178,"w":30,"h":30,"rot":0},{"id":"23","shape":"round","x":80,"y":240,"w":30,"h":30,"rot":0},{"id":"24","shape":"round","x":80,"y":302,"w":30,"h":30,"rot":0},{"id":"Šank","shape":"rect","x":236.5,"y":419,"w":207,"h":70,"rot":0}]} }
};

const RES_COLORS = ['#2f8a63','#b0603a','#3d73b0','#8d5bb0','#b8902a','#2f9494','#b74a63','#6f9a2a','#a0662f','#5a6fc0'];

const DAY_SHORT = ['ned','pon','uto','sri','čet','pet','sub'];

const GUESTS_RE = /^\s*(\d{1,3})\s*(?:[-–]\s*(\d{1,3}))?\s*$/;

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function fmtKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtShort(d){
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.`;
}

function parseGuests(s){
  const m = String(s || '').match(GUESTS_RE);
  if(!m) return [0, 0];
  const a = +m[1], b = m[2] ? +m[2] : a;
  return [Math.min(a, b), Math.max(a, b)];
}

function resList(ev){
  return Object.entries(ev.reservations || {})
    .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
}

function guestsWord(ev){
  let hi = 0;
  resList(ev).forEach(([, r]) => { hi += parseGuests(r.guests)[1]; });
  return pl(hi, 'osoba', 'osobe', 'osoba');
}
function guestTotal(ev){
  let lo = 0, hi = 0;
  resList(ev).forEach(([, r]) => { const [a, b] = parseGuests(r.guests); lo += a; hi += b; });
  return lo === hi ? `${lo}` : `${lo}–${hi}`;
}

function resTableIds(r){ return Array.isArray(r && r.tableIds) ? r.tableIds : []; }
// Šank je zajedničko mjesto: više ekipa ga može rezervisati i ne broji se kao sto.
const SHARED = new Set(['Šank']);
function isShared(id){ return SHARED.has(id); }
function realTables(ids){ return ids.filter(t => !isShared(t)); }
function resTables(r){
  const ids = resTableIds(r);
  if(ids.length) return realTables(ids).length;
  const n = parseInt(r && r.tables, 10);
  return n > 0 ? n : 1;
}


function tablesLabel(ev){
  const n = resList(ev).reduce((sum, [, r]) => sum + resTables(r), 0);
  return `${n} ${pl(n, 'sto', 'stola', 'stolova')}`;
}

function unseatedCount(ev){ return resList(ev).filter(([, r]) => !resTableIds(r).length).length; }
function layoutOf(ev){ return LAYOUTS[ev && ev.layout] || LAYOUTS.standard; }
// ===== Kapacitet: koliko stolova se smije rezervisati na događaju =====
// maxTables (nije obavezno) ostavlja dio stolova za goste bez rezervacije; prazno = svi stolovi iz šeme.
function capacity(ev){
  const all = layoutOf(ev).tables.filter(t => !isShared(t.id)).length;
  const m = parseInt(ev && ev.maxTables, 10);
  return m > 0 ? Math.min(m, all) : all;
}
function bookedTables(ev){ return resList(ev).reduce((sum, [, r]) => sum + resTables(r), 0); }
function waitingTables(ev){
  return Object.values((ev && ev.requests) || {})
    .filter(q => q && q.status !== 'rejected')
    .reduce((sum, q) => {
      const ids = Array.isArray(q.tableIds) ? q.tableIds : [];
      return sum + (ids.length ? realTables(ids).length : (parseInt(q.tables, 10) || 1));
    }, 0);
}
// Koliko je ljudi rezervisalo šank (zbir, može biti raspon)
function sharedGuests(ev, id){
  let lo = 0, hi = 0, n = 0;
  resList(ev).forEach(([, r]) => {
    if(resTableIds(r).includes(id)){ const [a, b] = parseGuests(r.guests); lo += a; hi += b; n++; }
  });
  return { n, lo, hi, label: lo === hi ? `${lo}` : `${lo}–${hi}` };
}
function freeTables(ev){ return capacity(ev) - bookedTables(ev); }
function capacityBar(ev){
  const cap = capacity(ev), booked = bookedTables(ev), wait = waitingTables(ev), free = cap - booked;
  const full = free <= 0;
  const color = full ? '#d99b8a' : free <= 2 ? '#e6c17a' : '#8fbf9d';
  return `<div class="cap-bar" style="border-color:${color};">
    <span><b style="color:${color};">${full ? (free < 0 ? `Prebukirano za ${-free}` : 'Popunjeno') : `Slobodno ${free}`}</b> · zauzeto ${booked}/${cap} ${pl(cap, 'stola', 'stola', 'stolova')}</span>
    ${wait ? `<span style="color:#e6c17a;">📩 na čekanju ${wait}</span>` : ''}
  </div>`;
}

function sortIds(ids){ return [...ids].sort((a, b) => a.localeCompare(b, 'sr', { numeric:true })); }
function placeLabel(id){ return /^\d+$/.test(id) ? `Sto ${id}` : id; }
function tablesText(ids){
  if(!ids.length) return '';
  const nums = sortIds(ids.filter(t => /^\d+$/.test(t)));
  const named = ids.filter(t => !/^\d+$/.test(t));
  const parts = [];
  if(nums.length) parts.push(`${nums.length > 1 ? 'Stolovi' : 'Sto'} ${nums.join(', ')}`);
  return [...parts, ...named].join(' + ');
}

function evDateLabel(e){
  const d = new Date(e.date + 'T00:00:00');
  return `${DAY_SHORT[d.getDay()]} ${fmtShort(d)}${e.time ? ' · ' + e.time : ''}`;
}

function renderPlan(ev){
  const L = layoutOf(ev);
  const list = resList(ev);
  const owner = {};
  list.forEach(([rid, r], i) => resTableIds(r).forEach(t => { if(!isShared(t)) owner[t] = { rid, color: RES_COLORS[i % RES_COLORS.length] }; }));
  const pts = a => a.map(p => p.join(',')).join(' ');
  let svg = `<svg viewBox="0 0 ${L.w} ${L.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Šema stolova">`;
  svg += `<polygon points="${pts(L.outline)}" fill="#1b1611" stroke="rgba(212,175,110,.35)" stroke-width="1.5"/>`;
  L.zones.forEach(z => {
    const fill = z.accent ? 'rgba(141,91,176,.35)' : '#2a231b';
    if(z.poly){
      const xs = z.poly.map(p => p[0]), ys = z.poly.map(p => p[1]);
      svg += `<polygon points="${pts(z.poly)}" fill="${fill}" stroke="rgba(212,175,110,.25)"/>`;
      svg += `<text x="${(Math.min(...xs) + Math.max(...xs)) / 2}" y="${(Math.min(...ys) + Math.max(...ys)) / 2}" fill="#9c9184" font-size="12" text-anchor="middle" font-family="-apple-system,sans-serif">${esc(z.label)}</text>`;
    } else {
      svg += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="5" fill="${fill}" stroke="rgba(212,175,110,.25)"/>`;
      svg += `<text x="${z.x + z.w / 2}" y="${z.y + z.h / 2 + 4}" fill="${z.accent ? '#d9c2ea' : '#9c9184'}" font-size="12" text-anchor="middle" font-family="-apple-system,sans-serif">${esc(z.label)}</text>`;
    }
  });
  L.tables.forEach(t => {
    if(isShared(t.id)){
      const g = sharedGuests(ev, t.id);
      const mine = assignResId && ev.reservations && ev.reservations[assignResId] && resTableIds(ev.reservations[assignResId]).includes(t.id);
      const pend = pendingTables.includes(t.id);
      const fill = g.n ? 'rgba(201,161,90,.30)' : pend ? 'rgba(201,161,90,.18)' : '#241e16';
      const stroke = mine ? '#ffffff' : pend ? '#e6c17a' : g.n ? '#c9a15a' : '#6b5a3c';
      svg += `<g class="tb" data-tid="${esc(t.id)}"><rect x="${t.x - t.w / 2}" y="${t.y - t.h / 2}" width="${t.w}" height="${t.h}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${mine || pend ? 3 : 1.5}"${pend ? ' stroke-dasharray="5 4"' : ''}/>`
        + `<text x="${t.x}" y="${t.y - (g.n ? 4 : -4)}" fill="#f4ede2" font-size="14" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif" pointer-events="none">${esc(t.id)}</text>`
        + (g.n ? `<text x="${t.x}" y="${t.y + 16}" fill="#e6c17a" font-size="12" text-anchor="middle" font-family="-apple-system,sans-serif" pointer-events="none">${g.label} ${pl(g.hi, 'osoba', 'osobe', 'osoba')} · ${g.n} ${pl(g.n, 'rez.', 'rez.', 'rez.')}</text>` : '')
        + `</g>`;
      return;
    }
    const o = owner[t.id];
    const pending = !o && pendingTables.includes(t.id);
    const active = o && o.rid === assignResId;
    const fill = o ? o.color : pending ? 'rgba(201,161,90,.35)' : '#241e16';
    const stroke = active ? '#ffffff' : o ? 'rgba(255,255,255,.35)' : pending ? '#e6c17a' : '#6b5a3c';
    const sw = active ? 3 : pending ? 2.5 : 1.5;
    const dash = pending ? ' stroke-dasharray="4 3"' : '';
    const shape = t.shape === 'round'
      ? `<circle cx="${t.x}" cy="${t.y}" r="${t.w / 2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>`
      : `<rect x="${t.x - t.w / 2}" y="${t.y - t.h / 2}" width="${t.w}" height="${t.h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}${t.rot ? ` transform="rotate(${t.rot} ${t.x} ${t.y})"` : ''}/>`;
    // Nevidljiva veća površina za lakši dodir prstom
    svg += `<g class="tb" data-tid="${esc(t.id)}"><circle cx="${t.x}" cy="${t.y}" r="24" fill="transparent"/>${shape}<text x="${t.x}" y="${t.y + 4.5}" fill="#f4ede2" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system,sans-serif" pointer-events="none">${esc(t.id)}</text></g>`;
  });
  return svg + '</svg>';
}

const viewEl = document.getElementById('view');
const liveEl = document.getElementById('live');
function fail(msg){
  viewEl.innerHTML = `<div class="view-msg">${esc(msg)}</div>`;
  liveEl.textContent = '';
}

// Zahtjevi koje su konobari poslali: čekaju potvrdu ili su odbijeni.
// Prihvaćeni postaju obične rezervacije i nestaju odavde.
function reqList(ev){
  const reqs = Object.values(ev.requests || {}).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if(!reqs.length) return '';
  return `<div style="margin-top:10px;">${reqs.map(q => {
    const ids = Array.isArray(q.tableIds) ? q.tableIds : [];
    const st = q.status === 'rejected' ? '<span style="color:#d99b8a;">✕ odbijeno</span>' : '<span style="color:#e6c17a;">⏳ čeka potvrdu</span>';
    return `<div class="req-row">${st} · <b>${esc(q.guest)}</b> · ${esc(q.guests)}${ids.length ? ` · ${esc(tablesText(ids).toLowerCase())}` : ''}<small>Prijavio/la: ${esc(q.by || 'konobar')}</small></div>`;
  }).join('')}</div>`;
}

function render(ev){
  lastEv = ev;
  if(assignResId && !(ev.reservations || {})[assignResId]) assignResId = null;
  document.getElementById('evTitle').innerHTML = `${esc(ev.title)}<span class="sub" id="brandSub">${esc(evDateLabel(ev))}</span>`;
  document.title = `${ev.title} — rezervacije`;
  const list = resList(ev);
  const unseated = unseatedCount(ev);
  const rows = list.length
    ? list.map(([rid, r], i) => {
        const ids = resTableIds(r);
        const n = resTables(r);
        return `<div class="res-row${rid === assignResId ? ' assigning' : ''}"><div class="res-main">
          <span class="res-dot" style="background:${realTables(ids).length ? RES_COLORS[i % RES_COLORS.length] : ids.length ? '#c9a15a' : 'transparent'};border:1px solid ${ids.length ? 'transparent' : 'var(--line)'};"></span><b>${esc(r.name)}</b> · ${esc(r.guests)}${!ids.length && n > 1 ? ` · ${n} ${pl(n, 'sto', 'stola', 'stolova')}` : ''}
          ${ids.length ? `<span class="res-table">🪑 ${esc(tablesText(ids))}</span>` : `<span class="res-notable">bez stola</span>`}
          ${r.table ? `<span class="res-table">${esc(r.table)}</span>` : ''}
          ${r.note ? `<span class="res-note">${esc(r.note)}</span>` : ''}
        </div></div>`;
      }).join('')
    : '<div class="ev-empty">Još nema rezervacija.</div>';
  viewEl.innerHTML = `<div class="ev-card open"><div class="ev-body" style="padding-top:14px;">
      ${ev.note ? `<div class="ev-note">${esc(ev.note)}</div>` : ''}
      ${capacityBar(ev)}
      <div class="ev-plan">${renderPlan(ev)}</div>
      ${rows}
      ${reqList(ev)}
      ${list.length ? `<div class="ev-total">Ukupno: <b>${tablesLabel(ev)}</b> · ${guestTotal(ev)} ${guestsWord(ev)}${unseated ? ` · <span style="color:#d99b8a;">${unseated} bez stola</span>` : ''}</div>` : ''}
    </div></div>`;
  document.getElementById('reqWrap').style.display = ev.date >= fmtKey(new Date()) ? '' : 'none';
  // Kad su stolovi puni (računajući i zahtjeve na čekanju), prijava ide samo za šank
  const noRoom = freeTables(ev) - waitingTables(ev) <= 0;
  document.getElementById('reqOpen').textContent = noRoom ? '➕ Prijavi za šank (stolovi su popunjeni)' : '➕ Prijavi rezervaciju';
  const t = new Date();
  liveEl.innerHTML = `<b>●</b> Uživo · ažurirano ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}

// Dodir na sto: ko je rezervisao (ili da je slobodan)
viewEl.addEventListener('click', e => {
  if(!lastEv) return;
  const g = e.target.closest('[data-tid]');
  if(!g){ if(assignResId){ assignResId = null; render(lastEv); } return; }
  const tid = g.dataset.tid;
  const owner = isShared(tid) ? null : resList(lastEv).find(([, r]) => resTableIds(r).includes(tid));
  if(isShared(tid) && !reqFormOpen()){
    const at = resList(lastEv).filter(([, r]) => resTableIds(r).includes(tid));
    const gs = sharedGuests(lastEv, tid);
    assignResId = null;
    render(lastEv);
    showInfo(at.length
      ? `🍺 <b>${esc(tid)}</b> · ${gs.label} ${pl(gs.hi, 'osoba', 'osobe', 'osoba')}<br>${at.map(([, r]) => `${esc(r.name)} (${esc(r.guests)})`).join(', ')}`
      : `🍺 ${esc(tid)}: još niko nije rezervisao`);
    return;
  }
  if(!owner && reqFormOpen()){
    const i = pendingTables.indexOf(tid);
    if(i >= 0) pendingTables.splice(i, 1); else pendingTables.push(tid);
    pendingTables.sort((a, b) => a.localeCompare(b, 'sr', { numeric:true }));
    updateReqTables();
    render(lastEv);
    return;
  }
  if(owner){
    const [rid, r] = owner;
    assignResId = rid;
    render(lastEv);
    showInfo(`🪑 ${esc(placeLabel(tid))}: <b>${esc(r.name)}</b> · ${esc(r.guests)} ${pl(parseGuests(r.guests)[1], 'osoba', 'osobe', 'osoba')}${resTableIds(r).length > 1 ? `<br>${esc(tablesText(resTableIds(r)))}` : ''}`);
  } else {
    assignResId = null;
    render(lastEv);
    showInfo(`🪑 ${esc(placeLabel(tid))} je slobodan`);
  }
});

// ===== Zahtjev za rezervaciju (konobar) =====
const LS_BY = 'keltpub_konobar';
function reqFormOpen(){ return document.getElementById('reqForm').style.display !== 'none'; }
function updateReqTables(){
  document.getElementById('qTables').textContent = pendingTables.length ? '🪑 ' + tablesText(pendingTables) : '—';
}
function closeReqForm(){
  document.getElementById('reqForm').style.display = 'none';
  document.getElementById('reqOpen').style.display = '';
  pendingTables.length = 0;
  ['qGuest','qGuests','qNote'].forEach(id => document.getElementById(id).value = '');
  updateReqTables();
  if(lastEv) render(lastEv);
}
document.getElementById('reqOpen').addEventListener('click', () => {
  document.getElementById('reqForm').style.display = '';
  document.getElementById('reqOpen').style.display = 'none';
  try{ document.getElementById('qBy').value = localStorage.getItem(LS_BY) || ''; }catch(e){}
  document.getElementById('qGuest').focus();
});
document.getElementById('reqCancel').addEventListener('click', closeReqForm);
document.getElementById('reqSend').addEventListener('click', async () => {
  const guest = document.getElementById('qGuest').value.trim();
  const guests = document.getElementById('qGuests').value.trim().replace(/\s*[-–]\s*/, '-');
  const note = document.getElementById('qNote').value.trim();
  const by = document.getElementById('qBy').value.trim();
  if(!guest){ showInfo('Upiši ime gosta'); document.getElementById('qGuest').focus(); return; }
  if(!GUESTS_RE.test(guests)){ showInfo('Broj osoba: npr. 3 ili 4-6'); document.getElementById('qGuests').focus(); return; }
  if(!by){ showInfo('Upiši svoje ime'); document.getElementById('qBy').focus(); return; }
  const need = pendingTables.length ? realTables(pendingTables).length : 1;
  const room = lastEv ? freeTables(lastEv) - waitingTables(lastEv) : 0;
  if(need > room){
    showInfo(room > 0
      ? `Slobodno je još samo ${room} ${pl(room, 'sto', 'stola', 'stolova')} — javi Žarku`
      : 'Stolovi su popunjeni — dodirni Šank na šemi ili javi Žarku');
    return;
  }
  try{ localStorage.setItem(LS_BY, by); }catch(e){}
  const btn = document.getElementById('reqSend');
  btn.disabled = true; btn.textContent = 'Šaljem…';
  const qid = 'q' + Date.now();
  const data = { guest, guests, note, by, status:'pending', createdAt: Date.now() };
  if(pendingTables.length) data.tableIds = [...pendingTables];
  try{
    await set(ref(db, `shiftSchedules/${tenantId}/events/${evId}/requests/${qid}`), data);
    closeReqForm();
    showInfo(`Poslano ✓ ${esc(guest)} čeka potvrdu`);
  }catch(e){
    console.error(e);
    showInfo('Nije poslano — provjeri internet i pokušaj ponovo');
  }finally{
    btn.disabled = false; btn.textContent = 'Pošalji';
  }
});

if(!tenantId || !evId || !key){
  fail('Link nije potpun. Zatraži novi link.');
} else {
  onValue(ref(db, `shiftSchedules/${tenantId}/events/${evId}`), snap => {
    const ev = snap.val();
    if(!ev || ev.shareToken !== key){ fail('Link nije važeći ili je događaj obrisan.'); return; }
    render(ev);
  }, err => {
    console.error(err);
    fail('Greška pri učitavanju. Provjeri internet vezu.');
  });
}
